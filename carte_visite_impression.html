<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Carte de Visite Luxe - BoostMySite</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;700;800;900&display=swap" rel="stylesheet">
  <style>
    /* Configuration Vistaprint (8.8cm x 5.8cm) */
    @page {
      size: 88mm 58mm;
      margin: 0;
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background: #050505; 
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      padding: 20px;
    }

    @media print {
      body {
        display: block !important; /* Indispensable pour que Safari accepte de séparer les pages */
        padding: 0;
        margin: 0;
        background: none;
      }
      .card-container {
        box-shadow: none !important;
        margin: 0 !important;
        break-after: page;
        page-break-after: always;
      }
    }

    .page-break {
      page-break-after: always;
      break-after: page;
    }

    .card-container {
      width: 88mm;
      height: 58mm;
      position: relative;
      background: #050505; 
      overflow: hidden;
      box-shadow: 0 10px 40px rgba(0,0,0,0.8);
      zoom: 4;
    }

    .bg-glow {
      position: absolute;
      width: 120%;
      height: 120%;
      background: radial-gradient(circle at 50% 50%, rgba(139, 92, 246, 0.08) 0%, rgba(6, 182, 212, 0.03) 40%, transparent 70%);
      top: -10%;
      left: -10%;
      z-index: 0;
      pointer-events: none;
    }

    .glowing-border {
      position: absolute;
      top: 3mm;
      left: 3mm;
      right: 3mm;
      bottom: 3mm;
      border-radius: 2mm;
      border: 0.15mm solid transparent;
      background: linear-gradient(#050505, #050505) padding-box, 
                  linear-gradient(135deg, rgba(6, 182, 212, 1), rgba(139, 92, 246, 1)) border-box;
      z-index: 1;
    }

    .safe-content {
      position: absolute;
      top: 4.5mm;
      left: 4.5mm;
      width: 79mm;  
      height: 49mm; 
      z-index: 2;
      display: flex;
    }

    /* ==================== RECTO (FACE LOGO) ==================== */
    .recto-content {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2mm;
    }

    .logo-large {
      width: 18mm;
      height: 18mm;
      filter: drop-shadow(0 0 12px rgba(6, 182, 212, 0.4));
    }

    .recto-text {
      text-align: center;
      width: 100%;
    }

    .logo-title {
      font-size: 19pt;
      font-weight: 900;
      line-height: 0.9;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      background: linear-gradient(135deg, #ffffff, #e5e7eb);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-left: 1.5px;
    }

    .logo-title-accent {
      background: linear-gradient(135deg, #06b6d4, #8b5cf6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .logo-subtitle {
      font-size: 5pt;
      font-weight: 400;
      letter-spacing: 4px;
      color: #9ca3af;
      margin-top: 1mm;
      text-transform: uppercase;
      margin-left: 4px; 
    }

    /* ==================== VERSO (INFOS CENTRÉES + GRILLE 2x2) ==================== */
    .verso-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center; 
      justify-content: center;
      width: 100%;
      height: 100%;
      padding: 0 1.5mm;
    }

    /* En-tête : Nom centré */
    .person-info {
      text-align: center;
      margin-bottom: 2mm;
    }

    .name {
      font-size: 11.5pt;
      font-weight: 800;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: #ffffff;
      line-height: 1;
    }

    .name-accent {
      font-weight: 300;
      color: #9ca3af;
    }

    .job-title {
      font-size: 5pt;
      color: #06b6d4;
      font-weight: 500;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-top: 1mm;
    }

    /* QR Code Marketing centré */
    .qr-marketing {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2mm;
      margin-bottom: 1mm;
    }

    .qr-image {
      width: 9mm; 
      height: 9mm;
      border-radius: 0.5mm;
      background: #ffffff;
      padding: 0.5mm;
    }

    .qr-text-block {
      display: flex;
      flex-direction: column;
      justify-content: center;
      text-align: left;
    }

    .qr-title {
      font-size: 4.5pt;
      font-weight: 800;
      background: linear-gradient(135deg, #06b6d4, #8b5cf6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .qr-subtitle {
      font-size: 4pt;
      font-weight: 300;
      color: #d1d5db;
      line-height: 1.2;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Séparateur centré */
    .divider {
      width: 60%; 
      height: 0.15mm;
      background: linear-gradient(90deg, rgba(6, 182, 212, 0), rgba(255, 255, 255, 0.4), rgba(139, 92, 246, 0));
      margin: 3mm 0; 
    }

    /* Grille de contact : 2 colonnes centrées globalement */
    .contact-grid {
      display: grid;
      grid-template-columns: max-content max-content; 
      column-gap: 5mm; 
      row-gap: 2.5mm; 
      justify-content: center; 
      align-items: center;
      width: 100%;
    }

    .contact-line {
      display: flex;
      align-items: center; 
      gap: 1.5mm;
    }

    .contact-icon {
      width: 3.2mm; 
      height: 3.2mm;
      flex-shrink: 0;
      color: #a78bfa;
    }

    .contact-text {
      font-size: 5.5pt; 
      color: #e5e7eb;
      font-weight: 300;
      letter-spacing: 0.5px;
      text-align: left;
    }

    .contact-text strong {
      font-weight: 500;
      color: #ffffff;
    }

    .contact-text.email {
      font-size: 5.2pt;
      white-space: nowrap; 
    }
    
    .contact-text.address {
      white-space: normal;
      line-height: 1.2;
    }
  </style>
</head>
<body>

  <!-- RECTO -->
  <div class="card-container page-break">
    <div class="bg-glow"></div>
    <div class="glowing-border"></div>
    <div class="safe-content">
      <div class="recto-content">
        <svg class="logo-large" viewBox="0 0 40 40">
          <defs>
            <linearGradient id="bms" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#06b6d4"/>
              <stop offset="100%" stop-color="#8b5cf6"/>
            </linearGradient>
          </defs>
          <rect x="4" y="4" width="32" height="32" rx="11" fill="url(#bms)"/>
          <rect x="10" y="12" width="20" height="16" rx="4" fill="#050505"/>
        </svg>

        <div class="recto-text">
          <div class="logo-title">BOOST<br><span class="logo-title-accent">MYSITE</span></div>
          <div class="logo-subtitle">Création Web Premium</div>
        </div>
      </div>
    </div>
  </div>

  <!-- VERSO -->
  <div class="card-container">
    <div class="bg-glow"></div>
    <div class="glowing-border"></div>
    <div class="safe-content">
      <div class="verso-content">
        
        <div class="person-info">
          <div class="name">BRAHIM <span class="name-accent">BENSAID</span></div>
          <div class="job-title">Fondateur & Ingénieur Web</div>
        </div>

        <div class="qr-marketing">
          <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://boost-my-site.com/%23configurateur&color=000000&bgcolor=ffffff&margin=1" alt="QR Code" class="qr-image">
          <div class="qr-text-block">
            <span class="qr-title">SCANNER</span>
            <span class="qr-subtitle">Devis immédiat IA</span>
          </div>
        </div>

        <div class="divider"></div>

        <div class="contact-grid">
          
          <div class="contact-line">
            <svg class="contact-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path></svg>
            <div class="contact-text"><strong>06 98 72 72 47</strong></div>
          </div>

          <div class="contact-line">
            <svg class="contact-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
            <div class="contact-text email">brahim.bensaid.pro75@gmail.com</div>
          </div>

          <div class="contact-line">
            <svg class="contact-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9"></path></svg>
            <div class="contact-text"><strong>boost-my-site.com</strong></div>
          </div>

          <div class="contact-line">
            <svg class="contact-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
            <div class="contact-text address">15 rue des écuries<br>95300 Pontoise</div>
          </div>

        </div>

      </div>
    </div>
  </div>

</body>
</html>
