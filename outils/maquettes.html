<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Maquettes Métiers — BoostMySite</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0F172A">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="app-icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="../assets/maquettes-switcher.js?v=20261120_02"></script>
  <style>
    :root {
      --bg: #F8FAFC;
      --surface: #FFFFFF;
      --ink: #0F172A;
      --muted: #64748B;
      --border: #E2E8F0;
      --green: #16A34A;
      --font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--ink);
      line-height: 1.45;
      min-height: 100vh;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: #0F172A;
      color: #fff;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border-bottom: 1px solid #1E293B;
    }

    .app-switch {
      display: inline-flex;
      background: #1E293B;
      padding: 3px;
      border-radius: 9px;
      gap: 2px;
    }
    .app-switch a {
      color: #94A3B8;
      text-decoration: none;
      font-size: 12px;
      font-weight: 700;
      padding: 5px 11px;
      border-radius: 7px;
      white-space: nowrap;
    }
    .app-switch a.active {
      background: var(--green);
      color: #fff;
    }

    .container {
      max-width: 1240px;
      margin: 0 auto;
      padding: 16px;
    }

    /* BARRE DE CONTRÔLE AVEC MENU DÉROULANT */
    .control-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
      margin-bottom: 14px;
      display: grid;
      grid-template-columns: 1.2fr 1fr 0.8fr auto;
      gap: 12px;
      align-items: end;
    }
    @media (max-width: 860px) {
      .control-panel {
        grid-template-columns: 1fr;
      }
    }
    .field label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
      margin-bottom: 5px;
    }
    .inp, .sel {
      width: 100%;
      height: 40px;
      padding: 0 12px;
      border: 1px solid var(--border);
      border-radius: 7px;
      font-size: 13.5px;
      font-family: inherit;
      color: var(--ink);
      background: #fff;
      outline: none;
    }
    .sel {
      cursor: pointer;
      font-weight: 600;
    }
    .inp:focus, .sel:focus {
      border-color: var(--ink);
    }

    .actions-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .btn {
      height: 40px;
      padding: 0 14px;
      border-radius: 7px;
      font-size: 12.5px;
      font-weight: 600;
      text-decoration: none;
      border: 1px solid var(--border);
      background: #fff;
      color: var(--ink);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
      font-family: inherit;
    }
    .btn-dark {
      background: var(--ink);
      color: #fff;
      border-color: var(--ink);
    }
    .btn-green {
      background: var(--green);
      color: #fff;
      border-color: var(--green);
    }

    /* APERÇU EN DIRECT */
    .preview-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }
    .preview-bar {
      padding: 10px 16px;
      background: #F1F5F9;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      font-size: 12.5px;
    }
    .device-switch {
      display: inline-flex;
      background: #E2E8F0;
      padding: 2px;
      border-radius: 6px;
    }
    .dev-btn {
      border: none;
      background: transparent;
      padding: 4px 10px;
      border-radius: 5px;
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
      color: #475569;
    }
    .dev-btn.active {
      background: #fff;
      color: var(--ink);
    }
    .iframe-wrap {
      background: #1E293B;
      display: flex;
      justify-content: center;
    }
    .iframe-wrap.mobile-mode {
      padding: 16px 0;
    }
    #maquetteIframe {
      width: 100%;
      height: calc(100vh - 210px);
      min-height: 540px;
      border: none;
      background: #fff;
    }
    .iframe-wrap.mobile-mode #maquetteIframe {
      width: 390px;
      height: 700px;
      border-radius: 20px;
      border: 4px solid #334155;
    }
  </style>
</head>
<body>

  <header>
    <div class="app-switch">
      <a href="tournee-clients.html">Carte</a>
      <a href="maquettes.html" class="active">Maquettes</a>
      <a href="devis-express.html">Devis</a>
      <a href="suivi-projets.html">Suivi</a>
    </div>
    <div style="font-size:12px; color:#94A3B8; font-weight:600;">12 Modèles Métiers</div>
  </header>

  <div class="container">
    <div class="control-panel">
      <div class="field">
        <label for="sectorSelect">Secteur d'activité (Menu déroulant)</label>
        <select id="sectorSelect" class="sel" onchange="onSectorChange()"></select>
      </div>
      <div class="field">
        <label for="clientCustomName">Nom du commerce (projection en direct)</label>
        <input type="text" id="clientCustomName" class="inp" placeholder="Ex : Boulangerie Saint-Martin" oninput="onClientNameChange()">
      </div>
      <div class="field">
        <label for="clientCustomPhone">Téléphone client (WhatsApp)</label>
        <input type="tel" id="clientCustomPhone" class="inp" placeholder="06 12 34 56 78">
      </div>
      <div class="actions-row">
        <a href="#" id="fullScreenBtn" target="_blank" class="btn">Plein écran</a>
        <button type="button" class="btn" onclick="sendWhatsAppDemo()">WhatsApp</button>
        <button type="button" class="btn btn-green" onclick="openDevisForCurrent()">Créer le devis</button>
      </div>
    </div>

    <div class="preview-card">
      <div class="preview-bar">
        <div>
          <strong id="previewTitle">Fast-Food &amp; Smash Burger</strong>
          <span style="color:var(--muted); margin-left:8px;" id="previewSub">Forfait conseillé : 990 €</span>
        </div>
        <div class="device-switch">
          <button type="button" class="dev-btn active" id="btnDevDesktop" onclick="setViewportMode('desktop')">Ordinateur</button>
          <button type="button" class="dev-btn" id="btnDevMobile" onclick="setViewportMode('mobile')">Mobile</button>
        </div>
      </div>
      <div class="iframe-wrap" id="iframeViewport">
        <iframe id="maquetteIframe" src="../sites/fastfood-smash.html?embed=1" title="Aperçu Maquette"></iframe>
      </div>
    </div>
  </div>

  <script>
    const catalog = (window.BMSMaquettes && window.BMSMaquettes.catalog) ? window.BMSMaquettes.catalog : [];
    let selectedId = catalog.length > 0 ? catalog[0].id : 'fastfood';

    function getClientName() {
      return (document.getElementById('clientCustomName').value || '').trim();
    }

    function buildDemoUrl(item, isEmbed) {
      const client = getClientName();
      const q = new URLSearchParams();
      if (client) q.set('client', client);
      if (isEmbed) q.set('embed', '1');
      const qs = q.toString();
      return `../sites/${item.file}${qs ? '?' + qs : ''}`;
    }

    function populateSelect() {
      const sel = document.getElementById('sectorSelect');
      sel.innerHTML = catalog.map(item => `
        <option value="${item.id}" ${item.id === selectedId ? 'selected' : ''}>
          ${item.label} (${item.price} €)
        </option>
      `).join('');
    }

    function updatePreview() {
      const item = catalog.find(x => x.id === selectedId) || catalog[0];
      if (!item) return;
      const client = getClientName();
      document.getElementById('previewTitle').textContent = item.label;
      document.getElementById('previewSub').textContent = client
        ? `Enseigne affichée : ${client} — Forfait : ${item.price} €`
        : `Enseigne par défaut : ${item.defaultBrand} — Forfait : ${item.price} €`;
      document.getElementById('maquetteIframe').src = buildDemoUrl(item, true);
      document.getElementById('fullScreenBtn').href = buildDemoUrl(item, false);
    }

    function onSectorChange() {
      selectedId = document.getElementById('sectorSelect').value;
      updatePreview();
    }

    let debounceTimer = null;
    function onClientNameChange() {
      const val = getClientName();
      try { sessionStorage.setItem('bms_demo_client_name', val); } catch (e) {}
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(updatePreview, 300);
    }

    function setViewportMode(mode) {
      document.getElementById('btnDevDesktop').classList.toggle('active', mode === 'desktop');
      document.getElementById('btnDevMobile').classList.toggle('active', mode === 'mobile');
      document.getElementById('iframeViewport').classList.toggle('mobile-mode', mode === 'mobile');
    }

    function sendWhatsAppDemo() {
      const item = catalog.find(x => x.id === selectedId) || catalog[0];
      const client = getClientName() || 'votre établissement';
      const q = new URLSearchParams();
      if (getClientName()) q.set('client', getClientName());
      const publicUrl = `${window.location.origin}/sites/${item.file}${q.toString() ? '?' + q.toString() : ''}`;

      const text = [
        `Bonjour, c'est Brahim de BoostMySite.`,
        ``,
        `Voici la maquette préparée pour ${client} (${item.label}) :`,
        publicUrl,
        ``,
        `Vous pouvez la consulter directement sur votre téléphone.`,
        `Brahim Ben Said — 06 98 72 72 47`
      ].join('\n');

      let phone = (document.getElementById('clientCustomPhone').value || '').replace(/[^0-9+]/g, '');
      if (phone.startsWith('0')) phone = '33' + phone.slice(1);
      const waLink = phone
        ? `https://wa.me/${phone}?text=${encodeURIComponent(text)}`
        : `https://wa.me/?text=${encodeURIComponent(text)}`;
      window.open(waLink, '_blank', 'noopener,noreferrer');
    }

    function openDevisForCurrent() {
      const item = catalog.find(x => x.id === selectedId) || catalog[0];
      const q = new URLSearchParams({
        pack: item.pack,
        price: String(item.price)
      });
      if (getClientName()) q.set('client', getClientName());
      const phone = (document.getElementById('clientCustomPhone').value || '').trim();
      if (phone) q.set('phone', phone);
      window.location.href = `devis-express.html?${q.toString()}`;
    }

    window.addEventListener('DOMContentLoaded', () => {
      const p = new URLSearchParams(window.location.search);
      if (p.get('client')) {
        document.getElementById('clientCustomName').value = p.get('client');
      } else {
        try {
          const saved = sessionStorage.getItem('bms_demo_client_name');
          if (saved) document.getElementById('clientCustomName').value = saved;
        } catch (e) {}
      }
      if (p.get('type')) {
        selectedId = p.get('type');
      }
      populateSelect();
      updatePreview();
    });
  </script>
</body>
</html>
