<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Maps Tournée — BoostMySite</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <style>
    :root {
      --bg: #F8FAFC;
      --surface: #FFFFFF;
      --ink: #0F172A;
      --muted: #64748B;
      --gblue: #1A73E8;
      --gblue-dark: #1557B0;
      --green: #16A34A;
      --green-bg: #DCFCE7;
      --red: #DC2626;
      --border: #E2E8F0;
      --font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      font-family: var(--font);
      color: var(--ink);
      background: var(--bg);
      height: 100%;
      height: 100dvh;
      width: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    /* TOP APP SWITCHER BAR */
    header {
      height: 48px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 40;
      flex-shrink: 0;
      gap: 8px;
    }

    .app-switch {
      display: inline-flex;
      background: #F1F5F9;
      padding: 3px;
      border-radius: 8px;
      gap: 2px;
    }

    .app-switch a {
      text-decoration: none;
      font-size: 12px;
      font-weight: 700;
      padding: 6px 10px;
      border-radius: 6px;
      color: var(--muted);
    }

    .app-switch a.active {
      background: var(--surface);
      color: var(--ink);
      box-shadow: 0 1px 2px rgba(0,0,0,0.08);
    }

    .top-right {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-top {
      padding: 6px 10px;
      border-radius: 7px;
      font-family: var(--font);
      font-size: 12px;
      font-weight: 600;
      border: 1px solid var(--border);
      background: #fff;
      color: var(--ink);
      text-decoration: none;
      cursor: pointer;
      white-space: nowrap;
    }

    /* MAIN WORKSPACE */
    .workspace {
      flex: 1;
      display: grid;
      grid-template-columns: 420px 1fr;
      overflow: hidden;
      position: relative;
      height: calc(100dvh - 48px);
    }

    /* SIDEBAR / MOBILE SHEET */
    .sidebar {
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      z-index: 30;
    }

    .sheet-mobile-header {
      display: none;
    }

    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      border-bottom: 1px solid var(--border);
      background: #F1F5F9;
      padding: 4px;
      gap: 4px;
      flex-shrink: 0;
    }

    .tab-btn {
      padding: 9px 10px;
      border: none;
      background: transparent;
      font-family: var(--font);
      font-size: 12.5px;
      font-weight: 700;
      color: var(--muted);
      border-radius: 6px;
      cursor: pointer;
    }

    .tab-btn.active {
      background: var(--surface);
      color: var(--gblue);
      box-shadow: 0 1px 2px rgba(0,0,0,0.06);
    }

    .tab-pane {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 14px;
      display: none;
    }

    .tab-pane.active {
      display: block;
    }

    /* FORM ELEMENTS (16PX FONT SIZE PREVENTS SAFARI IOS ZOOM) */
    .section-box {
      background: #F8FAFC;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 12px;
    }

    .section-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--ink);
      margin-bottom: 4px;
    }

    input[type="text"],
    input[type="time"],
    select,
    textarea {
      width: 100%;
      padding: 10px 11px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-family: var(--font);
      font-size: 16px;
      color: var(--ink);
      background: #fff;
      outline: none;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
      line-height: 1.4;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 14px;
      border-radius: 8px;
      font-family: var(--font);
      font-size: 13px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      text-decoration: none;
      white-space: nowrap;
    }

    .btn-blue { background: var(--gblue); color: #fff; }
    .btn-outline { background: #fff; color: var(--ink); border: 1px solid var(--border); }
    .btn-xs { padding: 7px 10px; font-size: 12px; border-radius: 7px; }

    .client-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 220px;
      overflow-y: auto;
      margin-top: 10px;
    }

    .client-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      background: #fff;
      border: 1px solid var(--border);
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 12.5px;
    }

    .client-row strong {
      display: block;
      font-size: 12.5px;
    }

    .client-row span {
      color: var(--muted);
      font-size: 11px;
    }

    .sidebar-footer {
      padding: 12px 14px;
      border-top: 1px solid var(--border);
      background: var(--surface);
      flex-shrink: 0;
    }

    /* STATS STRIP */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-bottom: 12px;
    }

    .stat-card {
      background: #F8FAFC;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 4px;
      text-align: center;
    }

    .stat-card span {
      display: block;
      font-size: 10.5px;
      color: var(--muted);
      font-weight: 600;
    }

    .stat-card strong {
      font-size: 14px;
      font-weight: 800;
    }

    /* TIMELINE LIST */
    .timeline {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-bottom: 24px;
    }

    .stop-item {
      background: #fff;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 11px;
      display: grid;
      grid-template-columns: 30px 1fr;
      gap: 10px;
      cursor: pointer;
    }

    .stop-item.done {
      opacity: 0.6;
      background: #F0FDF4;
      border-color: #86EFAC;
    }

    .badge-num {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: var(--gblue);
      color: #fff;
      font-weight: 800;
      font-size: 12.5px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .stop-item.done .badge-num { background: var(--green); }
    .badge-num.start { background: var(--ink); }

    .leg-meta {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      color: var(--gblue);
      background: #EFF6FF;
      padding: 2px 7px;
      border-radius: 99px;
      margin-bottom: 3px;
    }

    .stop-actions {
      display: flex;
      gap: 6px;
      margin-top: 8px;
      flex-wrap: wrap;
    }

    /* MAP AREA */
    .map-Area {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    #map {
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* FLOATING TOP PILL ON MAP */
    .mobile-map-top-bar {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      z-index: 500;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      pointer-events: none;
    }

    .mobile-map-top-bar > * {
      pointer-events: auto;
    }

    .tour-summary-pill {
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(8px);
      color: #fff;
      padding: 7px 12px;
      border-radius: 99px;
      font-size: 11.5px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.2);
    }

    .tour-summary-pill .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #4ADE80;
    }

    .map-right-controls {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .circle-map-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #fff;
      border: 1px solid var(--border);
      box-shadow: 0 3px 10px rgba(0,0,0,0.18);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      color: var(--ink);
    }

    /* BOTTOM SWIPEABLE STOP CARDS ON MAP */
    .map-cards-strip {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 10px;
      z-index: 500;
      display: flex;
      gap: 10px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      padding: 4px 12px 6px;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }

    .map-cards-strip::-webkit-scrollbar {
      display: none;
    }

    .map-stop-card {
      flex: 0 0 min(380px, calc(100vw - 24px));
      scroll-snap-align: center;
      background: #FFFFFF;
      border: 1.5px solid var(--border);
      border-radius: 14px;
      padding: 12px 13px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.22);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .map-stop-card.active-card {
      border-color: var(--gblue);
    }

    .map-stop-card.done-card {
      background: #F0FDF4;
      border-color: #86EFAC;
    }

    .msc-header-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      font-weight: 700;
      color: var(--gblue);
    }

    .msc-step-arrows {
      display: flex;
      gap: 4px;
    }

    .msc-arrow-btn {
      border: 1px solid var(--border);
      background: #F8FAFC;
      color: var(--ink);
      border-radius: 6px;
      padding: 3px 8px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }

    .msc-top {
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }

    .msc-num {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: var(--gblue);
      color: #fff;
      font-weight: 800;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .map-stop-card.done-card .msc-num {
      background: var(--green);
    }

    .msc-info {
      flex: 1;
      min-width: 0;
    }

    .msc-title {
      font-size: 14px;
      font-weight: 800;
      color: var(--ink);
      line-height: 1.25;
    }

    .msc-addr {
      font-size: 11.5px;
      color: var(--muted);
      margin-top: 1px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .msc-pitch {
      font-size: 11.5px;
      color: #9A3412;
      background: #FFF7ED;
      border: 1px solid #FED7AA;
      padding: 5px 8px;
      border-radius: 7px;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* TWO CLEAN ROWS OF THUMB BUTTONS ON MOBILE CARD */
    .msc-actions-primary {
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 6px;
    }

    .msc-actions-secondary {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 6px;
    }

    .msc-btn {
      min-height: 38px;
      padding: 7px 8px;
      border-radius: 8px;
      font-family: var(--font);
      font-size: 12px;
      font-weight: 700;
      border: 1px solid var(--border);
      background: #F8FAFC;
      color: var(--ink);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      cursor: pointer;
      white-space: nowrap;
    }

    .msc-btn.primary {
      background: var(--gblue);
      color: #fff;
      border-color: var(--gblue);
      font-size: 12.5px;
    }

    .msc-btn.done-btn {
      background: #fff;
      border-color: var(--border);
      font-size: 12.5px;
    }

    .msc-btn.done-btn.is-done {
      background: var(--green);
      color: #fff;
      border-color: var(--green);
    }

    /* MAP PINS */
    .g-pin {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--gblue);
      color: #fff;
      border: 2px solid #fff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.35);
      font-weight: 800;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .g-pin.done-pin { background: var(--green); }
    .g-pin.start { background: #0F172A; width: 32px; height: 32px; }

    .gps-user-dot {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #1A73E8;
      border: 3px solid #fff;
      box-shadow: 0 0 0 6px rgba(26, 115, 232, 0.28);
    }

    .mobile-bottom-nav {
      display: none;
    }

    /* ==========================================================
       MOBILE VIEWPORT (< 920px)
       ========================================================== */
    @media (max-width: 920px) {
      .workspace {
        display: block;
        position: relative;
        width: 100%;
        height: calc(100dvh - 48px - 54px - var(--safe-bottom));
      }

      .map-Area {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
      }

      .leaflet-control-zoom,
      .leaflet-control-attribution {
        display: none !important;
      }

      .sidebar {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 600;
        border-right: none;
        transform: translateY(105%);
        transition: transform 0.24s cubic-bezier(0.22, 1, 0.36, 1);
      }

      .sidebar.mobile-sheet-open {
        transform: translateY(0);
      }

      .sidebar .tabs {
        display: none;
      }

      .sheet-mobile-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px 14px;
        border-bottom: 1px solid var(--border);
        background: var(--surface);
        flex-shrink: 0;
      }

      .sheet-mobile-header strong {
        font-size: 14px;
      }

      .mobile-bottom-nav {
        height: calc(54px + var(--safe-bottom));
        padding-bottom: var(--safe-bottom);
        background: var(--surface);
        border-top: 1px solid var(--border);
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        z-index: 700;
        flex-shrink: 0;
      }

      .m-nav-btn {
        border: none;
        background: transparent;
        font-family: var(--font);
        font-size: 11px;
        font-weight: 700;
        color: var(--muted);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2px;
        cursor: pointer;
      }

      .m-nav-btn .m-icon {
        font-size: 16px;
        line-height: 1;
      }

      .m-nav-btn.active {
        color: var(--gblue);
      }
    }
  </style>
</head>
<body>

  <!-- BARRE HAUTE : SWITCH 1-CLIC ENTRE CARTE ET DEVIS -->
  <header>
    <div class="app-switch">
      <a href="tournee-clients.html" class="active">📍 Carte Tournée</a>
      <a href="devis-express.html">📄 Devis Express</a>
    </div>
    <div class="top-right">
      <button type="button" class="btn-top" onclick="loadPontoisePreset(true)">↺ Pontoise</button>
      <a href="../portfolio.html" class="btn-top">Démos</a>
    </div>
  </header>

  <div class="workspace">
    <!-- SIDEBAR (GAUCHE SUR PC, TIROIR SUR MOBILE) -->
    <aside class="sidebar" id="mainSidebar">
      <div class="sheet-mobile-header">
        <strong id="mobileSheetTitle">Feuille de route</strong>
        <button type="button" class="btn-top" onclick="switchMobileMode('map')">✕ Voir la carte</button>
      </div>

      <div class="tabs">
        <button type="button" class="tab-btn active" id="tabBtnRoute" onclick="switchView('route')">
          1. Ordre Optimisé (<span id="doneProgressBadge">0/0</span>)
        </button>
        <button type="button" class="tab-btn" id="tabBtnSetup" onclick="switchView('setup')">
          2. Adresses (<span id="countBadge">0</span>)
        </button>
      </div>

      <!-- ONGLET 1 : LISTE OPTIMISÉE -->
      <div class="tab-pane active" id="paneRoute">
        <div class="stats-grid">
          <div class="stat-card">
            <span>Trajet</span>
            <strong id="statDriveTime">—</strong>
          </div>
          <div class="stat-card">
            <span>Distance</span>
            <strong id="statDistance">—</strong>
          </div>
          <div class="stat-card">
            <span>Fin RDV</span>
            <strong id="statEndTime">—</strong>
          </div>
        </div>

        <div id="exportBox" style="display:none; margin-bottom:12px; background:#EFF6FF; border:1px solid #BFDBFE; border-radius:10px; padding:10px;">
          <div style="font-size:11.5px; font-weight:700; color:#1E3A8A; margin-bottom:6px;">
            Ouvrir l'itinéraire complet dans Google Maps :
          </div>
          <div id="gmapsSegmentsContainer" style="display:flex; flex-wrap:wrap; gap:6px; margin-bottom:6px;"></div>
          <div style="display:flex; gap:6px;">
            <button type="button" class="btn btn-outline btn-xs" style="flex:1;" onclick="copyFirstGmapsLink()">Copier le lien</button>
            <button type="button" class="btn btn-outline btn-xs" onclick="resetDoneStatus()">Réinitialiser</button>
          </div>
        </div>

        <div class="timeline" id="itineraryOutput"></div>
      </div>

      <!-- ONGLET 2 : ADRESSES & DÉPART -->
      <div class="tab-pane" id="paneSetup">
        <div class="section-box">
          <div class="section-title">
            <span>Point de départ</span>
            <button type="button" class="btn btn-outline btn-xs" onclick="useMyGPS()">📍 Mon GPS</button>
          </div>
          <input type="text" id="startAddress" value="15 Rue des Écuries, 95300 Pontoise" placeholder="Adresse de départ">

          <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px; margin-top:8px;">
            <div>
              <label for="travelMode">Mode</label>
              <select id="travelMode" onchange="optimizeRoute()">
                <option value="driving" selected>Voiture</option>
                <option value="foot">À pied</option>
                <option value="bike">Vélo</option>
              </select>
            </div>
            <div>
              <label for="startTime">Départ</label>
              <input type="time" id="startTime" value="14:00" onchange="optimizeRoute()">
            </div>
            <div>
              <label for="dwellMinutes">RDV</label>
              <select id="dwellMinutes" onchange="optimizeRoute()">
                <option value="10">10 min</option>
                <option value="15" selected>15 min</option>
                <option value="20">20 min</option>
              </select>
            </div>
          </div>

          <label style="display:flex; align-items:center; gap:7px; margin-top:8px; cursor:pointer; font-weight:500;">
            <input type="checkbox" id="returnToStart" onchange="optimizeRoute()"> Boucler vers le départ à la fin
          </label>
        </div>

        <div class="section-box">
          <div class="section-title">
            <span>Ajouter des adresses ou lien Maps</span>
            <button type="button" class="btn btn-outline btn-xs" onclick="clearAllProspects()">Vider</button>
          </div>
          <textarea id="bulkInput" placeholder="1 adresse par ligne ou lien Google Maps complet..."></textarea>
          <button type="button" class="btn btn-outline" style="width:100%; margin-top:8px;" onclick="addFromBulk()">
            + Ajouter à la liste
          </button>

          <div class="client-list" id="prospectsListContainer"></div>
        </div>
      </div>

      <div class="sidebar-footer">
        <button type="button" class="btn btn-blue" style="width:100%; padding:13px;" id="btnOptimize" onclick="optimizeRoute()">
          ⚡ Recalculer l'itinéraire
        </button>
        <div id="statusMsg" style="font-size:11px; color:var(--muted); text-align:center; margin-top:4px;"></div>
      </div>
    </aside>

    <!-- CARTE PLEIN ÉCRAN + FICHES EN BAS -->
    <main class="map-Area">

          const cards = Array.from(strip.querySelectorAll('.map-stop-card'));
          if (!cards.length) return;
          const stripCenter = strip.scrollLeft + strip.clientWidth / 2;
          let closest = null;
          let minDelta = Infinity;
          cards.forEach(c => {
            const cCenter = c.offsetLeft + c.offsetWidth / 2;

            if (d < minDelta) { minDelta = d; closest = c; }
          });
          if (closest) {
            highlightActiveCardAndPin(parseInt(closest.dataset.step, 10), true);
          }
        }, 120);

    function addFromBulk() {
      const textarea = document.getElementById('bulkInput');
      const rawText = textarea.value.trim();
      if (!rawText) return;

      if (rawText.includes('google.com/maps/dir/') || rawText.includes('google.fr/maps/dir/')) {
        try {
          const afterDir = rawText.split('/maps/dir/')[1].split('?')[0];
          const parts = afterDir.split('/').filter(seg => seg && !seg.startsWith('@') && !seg.startsWith('data='));
          const decoded = parts.map(seg => decodeURIComponent(seg.replace(/\+/g, ' ')).trim()).filter(Boolean);
          if (decoded.length >= 2) {
            document.getElementById('startAddress').value = decoded[0];
            prospects = decoded.slice(1).map(addr => ({
              name: addr.split(',')[0].trim(),
              address: addr
            }));
            textarea.value = '';
            saveProspects();
            renderRawProspects();
            optimizeRoute();
            return;
          }
        } catch (e) {}
      }

      rawText.split('\n').forEach(line => {
        let cleaned = line.trim().replace(/^Client\s*:\s*/i, '');
        if (!cleaned) return;
        for (const sep of [' - ', ' | ', ' — ', ';']) {
          if (cleaned.includes(sep)) {
            const p = cleaned.split(sep);
            const name = p.shift().trim();
            const address = p.join(sep).trim();
            prospects.push({ name: name || address, address: address || name });
            return;
          }
        }
        prospects.push({ name: cleaned.split(',')[0].trim(), address: cleaned });
      });

      textarea.value = '';
      saveProspects();
      renderRawProspects();
      optimizeRoute();
    }

    function locateUserOnMap() {
      if (!navigator.geolocation) return alert('Géolocalisation non disponible.');

        const { latitude, longitude } = pos.coords;
        if (userLocationMarker) map.removeLayer(userLocationMarker);
        const icon = L.divIcon({
          className: '',
          html: '<div class="gps-user-dot"></div>',
          iconSize: [18, 18],
          iconAnchor: [9, 9]
        });

        map.flyTo([latitude, longitude], 16, { duration: 0.6 });
      }, () => {
        alert('Activez la localisation GPS pour vous voir sur la carte.');
      }, { enableHighAccuracy: true });
    }

      if (!navigator.geolocation) return alert('Géolocalisation non disponible.');
      navigator.geolocation.getCurrentPosition(async (pos) => {
        const { latitude, longitude } = pos.coords;
        try {
          const res = await fetch(`https://api-adresse.data.gouv.fr/reverse/?lon=${longitude}&lat=${latitude}`);
          const data = await res.json();

          optimizeRoute();
        }
      });
    }

    function haversineMeters(a, b) {
      const R = 6371000;
      const toRad = d => d * Math.PI / 180;
      const dLat = toRad(b.lat - a.lat);
      const dLon = toRad(b.lon - a.lon);
      const s = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(a.lat)) * Math.cos(toRad(b.lat)) * Math.sin(dLon / 2) ** 2;
      return 2 * R * Math.asin(Math.sqrt(s));
    }

    async function geocodeSmart(rawQuery, biasGeo = null) {
      const cleanQuery = rawQuery.replace(/^Client\s*:\s*/i, '').trim();
      const gpsMatch = cleanQuery.match(/^\s*(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)\s*$/);
      if (gpsMatch) {
        return { lat: parseFloat(gpsMatch[1]), lon: parseFloat(gpsMatch[2]), label: cleanQuery };
      }

      const candidates = [cleanQuery];
      if (cleanQuery.includes(',')) {
        const afterComma = cleanQuery.split(',').slice(1).join(',').trim();
        if (afterComma.length > 5) candidates.push(afterComma);
      }

      let bestMatch = null;
      let bestDist = Infinity;

      for (const q of candidates) {
        let url = `https://api-adresse.data.gouv.fr/search/?q=${encodeURIComponent(q)}&limit=5`;
        if (biasGeo && biasGeo.lat && biasGeo.lon) url += `&lat=${biasGeo.lat}&lon=${biasGeo.lon}`;
        try {
          const res = await fetch(url);
          const data = await res.json();
          if (data.features && data.features.length > 0) {
            for (const feat of data.features) {
              const pt = {
                lon: feat.geometry.coordinates[0],
                lat: feat.geometry.coordinates[1],
                label: feat.properties.label
              };
              if (!biasGeo) return pt;
              const d = haversineMeters(biasGeo, pt);
              if (d < bestDist) { bestDist = d; bestMatch = pt; }
              if (d < 25000) return pt;
            }
          }
        } catch (e) {}
      }
      if (bestMatch) return bestMatch;
      throw new Error('Adresse introuvable : ' + rawQuery);
    }

    function solveTSP(matrix, returnToStart) {
      const n = matrix.length;
      const visited = new Array(n).fill(false);
      visited[0] = true;
      const order = [0];

      for (let step = 1; step < n; step++) {
        const last = order[order.length - 1];
        let bestNext = -1;
        let bestCost = Infinity;
        for (let c = 1; c < n; c++) {
          if (!visited[c] && matrix[last][c] < bestCost) {
            bestCost = matrix[last][c];
            bestNext = c;
          }
        }
        visited[bestNext] = true;
        order.push(bestNext);
      }
      if (returnToStart) order.push(0);

      function routeCost(seq) {
        let total = 0;
        for (let i = 0; i < seq.length - 1; i++) total += matrix[seq[i]][seq[i + 1]];
        return total;
      }

      const endLimit = returnToStart ? order.length - 2 : order.length - 1;
      let improved = true;
      while (improved) {
        improved = false;
        for (let i = 1; i < endLimit; i++) {
          for (let k = i + 1; k <= endLimit; k++) {
            const candidate = order.slice(0, i).concat(order.slice(i, k + 1).reverse()).concat(order.slice(k + 1));
            if (routeCost(candidate) + 0.05 < routeCost(order)) {
              for (let m = 0; m < order.length; m++) order[m] = candidate[m];
              improved = true;
            }
          }
        }
      }
      return order;
    }

    function addMinutesToTime(timeStr, minsToAdd) {
      const [hh, mm] = (timeStr || '14:00').split(':').map(Number);
      const total = hh * 60 + mm + Math.round(minsToAdd);
      const h = Math.floor((total / 60) % 24);
      const m = total % 60;
      return String(h).padStart(2, '0') + 'h' + String(m).padStart(2, '0');
    }

    async function optimizeRoute() {
      if (document.getElementById('bulkInput').value.trim()) {
        addFromBulk();
        return;
      }
      if (prospects.length === 0) return;
      const startAddr = document.getElementById('startAddress').value.trim();
      if (!startAddr) return;

      const btn = document.getElementById('btnOptimize');
      const status = document.getElementById('statusMsg');
      const pillText = document.getElementById('mapPillText');
      btn.disabled = true;
      pillText.textContent = 'Calcul de la tournée...';

      try {
        const startGeo = await geocodeSmart(startAddr, null);
        const nodes = [{
          isStart: true,
          name: 'Départ',
          address: startGeo.label,
          lat: startGeo.lat,
          lon: startGeo.lon
        }];

        for (let i = 0; i < prospects.length; i++) {
          status.textContent = `Localisation (${i + 1}/${prospects.length})...`;
          const g = await geocodeSmart(prospects[i].address, startGeo);
          nodes.push({
            isStart: false,
            name: prospects[i].name,
            address: g.label,
            phone: prospects[i].phone || '',
            pitch: prospects[i].pitch || '',
            demo: prospects[i].demo || '../sites/fastfood-smash.html',
            pack: prospects[i].pack || 'pro',
            lat: g.lat,
            lon: g.lon
          });
        }

        const mode = document.getElementById('travelMode').value;
        const speedKmh = mode === 'foot' ? 4.8 : (mode === 'bike' ? 16.5 : 28);
        const n = nodes.length;
        const durations = Array.from({ length: n }, () => new Array(n).fill(0));
        const distances = Array.from({ length: n }, () => new Array(n).fill(0));

        try {
          const coordsStr = nodes.map(pt => `${pt.lon},${pt.lat}`).join(';');
          const res = await fetch(`https://router.project-osrm.org/table/v1/driving/${coordsStr}?annotations=duration,distance`);
          const data = await res.json();
          if (data.code === 'Ok' && data.distances) {
            for (let i = 0; i < n; i++) {
              for (let j = 0; j < n; j++) {
                const distM = data.distances[i][j] ?? (haversineMeters(nodes[i], nodes[j]) * 1.28);
                distances[i][j] = distM;
                durations[i][j] = (mode === 'driving' && data.durations && data.durations[i][j])
                  ? data.durations[i][j]
                  : (distM / 1000) / speedKmh * 3600;
              }
            }
          } else {
            throw new Error('Fallback');
          }
        } catch (e) {
          for (let i = 0; i < n; i++) {
            for (let j = 0; j < n; j++) {
              if (i === j) continue;
              const roadM = haversineMeters(nodes[i], nodes[j]) * 1.28;
              distances[i][j] = roadM;
              durations[i][j] = (roadM / 1000) / speedKmh * 3600;
            }
          }
        }

        const returnToStart = document.getElementById('returnToStart').checked;
        const order = solveTSP(durations, returnToStart);

        await renderOptimizedMapAndList(nodes, order, durations, distances);
        switchView('route');
        if (window.innerWidth <= 920) switchMobileMode('map');
        status.textContent = '';
      } catch (err) {
        alert(err.message || 'Erreur de localisation.');
      } finally {
        btn.disabled = false;
      }
    }

    async function renderOptimizedMapAndList(nodes, order, durations, distances) {
      markersLayer.clearLayers();
      mapMarkerRefs = [];
      if (routeShadowLine) map.removeLayer(routeShadowLine);
      if (routeMainLine) map.removeLayer(routeMainLine);

      const startTime = document.getElementById('startTime').value || '14:00';
      const dwellMins = parseInt(document.getElementById('dwellMinutes').value, 10) || 15;
      const mode = document.getElementById('travelMode').value;
      const gmapsTravelMode = mode === 'foot' ? 'walking' : (mode === 'bike' ? 'bicycling' : 'driving');

      let totalDriveSec = 0;
      let totalDistMeters = 0;
      let elapsedMinutes = 0;
      const orderedNodes = order.map(idx => nodes[idx]);
      currentOrderedNodes = orderedNodes;
      const totalClientStops = prospects.length;

      const htmlCards = [];
      const bottomStripCards = [];

      orderedNodes.forEach((node, stepPos) => {
        if (stepPos === 0) {
          const icon = L.divIcon({
            className: '',
            html: '<div class="g-pin start">D</div>',
            iconSize: [32, 32],
            iconAnchor: [16, 16]
          });
          mapMarkerRefs[0] = L.marker([node.lat, node.lon], { icon })
            .bindPopup(`<strong>Départ (${startTime.replace(':','h')})</strong><br>${escHtml(node.address)}`)
            .addTo(markersLayer);

          htmlCards.push(`
            <div class="stop-item" onclick="selectStopFromList(0)">
              <div class="badge-num start">D</div>
              <div>
                <span class="leg-meta">Départ à ${startTime.replace(':', 'h')}</span>
                <strong style="display:block; font-size:13px;">Point de départ</strong>
                <span style="font-size:11.5px; color:var(--muted);">${escHtml(node.address)}</span>
              </div>
            </div>
          `);
          return;
        }

        const prevIdx = order[stepPos - 1];
        const currIdx = order[stepPos];
        const legSec = durations[prevIdx][currIdx];
        const legMeters = distances[prevIdx][currIdx];
        totalDriveSec += legSec;
        totalDistMeters += legMeters;

        const legMins = Math.max(1, Math.round(legSec / 60));
        const legKm = (legMeters / 1000).toFixed(1).replace('.', ',');
        elapsedMinutes += legMins;
        const arrivalStr = addMinutesToTime(startTime, elapsedMinutes);

        if (node.isStart) return;

        const isDone = Boolean(doneAddresses[node.address]);
        const icon = L.divIcon({
          className: '',
          html: `<div class="g-pin ${isDone ? 'done-pin' : ''}" id="mapPin-${stepPos}">${isDone ? '✓' : stepPos}</div>`,
          iconSize: [28, 28],
          iconAnchor: [14, 14]
        });
        mapMarkerRefs[stepPos] = L.marker([node.lat, node.lon], { icon })
          .on('click', () => scrollStripToStep(stepPos))
          .addTo(markersLayer);

        const singleMapsUrl = `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(node.address)}&travelmode=${gmapsTravelMode}`;
        const demoUrl = node.demo || '../sites/fastfood-smash.html';
        const devisUrl = `devis-express.html?client=${encodeURIComponent(node.name)}&address=${encodeURIComponent(node.address)}&phone=${encodeURIComponent(node.phone || '')}&pack=${encodeURIComponent(node.pack || 'pro')}`;
        const cleanTel = (node.phone || '').replace(/\s+/g, '');

        // Fiche dans l'onglet Liste
        htmlCards.push(`
          <div class="stop-item ${isDone ? 'done' : ''}" id="stopCard-${stepPos}" onclick="selectStopFromList(${stepPos})">
            <div class="badge-num" id="listBadge-${stepPos}">${isDone ? '✓' : stepPos}</div>
            <div>
              <span class="leg-meta">${legMins} min (${legKm} km) • ${arrivalStr}</span>
              <strong style="display:block; font-size:13.5px;">${escHtml(node.name)}</strong>
              <span style="font-size:11.5px; color:var(--muted); display:block;">${escHtml(node.address)}</span>
              ${node.pitch ? `<div style="font-size:11.5px; color:#9A3412; background:#FFF7ED; padding:5px 7px; border-radius:6px; margin-top:4px;">${escHtml(node.pitch)}</div>` : ''}
              <div class="stop-actions" onclick="event.stopPropagation();">
                <a href="${singleMapsUrl}" target="_blank" class="btn btn-blue btn-xs">🗺️ Y aller</a>
                <a href="${demoUrl}" target="_blank" class="btn btn-outline btn-xs">🖥️ Démo</a>
                <a href="${devisUrl}" class="btn btn-outline btn-xs">📄 Devis</a>
                <button type="button" class="btn btn-outline btn-xs" onclick="toggleStopDone(${stepPos}, '${escHtml(node.address).replace(/'/g, "\\'")}')">
                  ${isDone ? '✓ Fait' : 'Fait'}
                </button>
              </div>
            </div>
          </div>
        `);

        // Fiche en bas de la carte (optimisée téléphone 2 rangées de boutons)
        bottomStripCards.push(`
          <div class="map-stop-card ${stepPos === 1 ? 'active-card' : ''} ${isDone ? 'done-card' : ''}" id="mscCard-${stepPos}" data-step="${stepPos}">
            <div class="msc-header-nav">
              <span>Arrêt ${stepPos}/${totalClientStops} • ${legMins} min (${legKm} km) • ${arrivalStr}</span>
              <div class="msc-step-arrows">
                <button type="button" class="msc-arrow-btn" onclick="scrollStripToStep(${Math.max(1, stepPos - 1)})">←</button>
                <button type="button" class="msc-arrow-btn" onclick="scrollStripToStep(${Math.min(totalClientStops, stepPos + 1)})">→</button>
              </div>
            </div>
            <div class="msc-top" onclick="highlightActiveCardAndPin(${stepPos}, true)">
              <div class="msc-num" id="mscNum-${stepPos}">${isDone ? '✓' : stepPos}</div>
              <div class="msc-info">
                <div class="msc-title">${escHtml(node.name)}</div>
                <div class="msc-addr">${escHtml(node.address)}</div>
              </div>
            </div>
            ${node.pitch ? `<div class="msc-pitch">${escHtml(node.pitch)}</div>` : ''}
            <div class="msc-actions-primary">
              <a href="${singleMapsUrl}" target="_blank" class="msc-btn primary">🗺️ Lancer GPS Maps</a>
              <button type="button" class="msc-btn done-btn ${isDone ? 'is-done' : ''}" id="mscDoneBtn-${stepPos}" onclick="toggleStopDone(${stepPos}, '${escHtml(node.address).replace(/'/g, "\\'")}')">
                ${isDone ? '✓ Terminé' : '✅ Fait (Suivant →)'}
              </button>
            </div>
            <div class="msc-actions-secondary">
              <a href="${demoUrl}" target="_blank" class="msc-btn">🖥️ Démo</a>
              <a href="${devisUrl}" class="msc-btn">📄 Devis</a>
              ${cleanTel ? `<a href="tel:${cleanTel}" class="msc-btn">📞 Appeler</a>` : `<a href="https://waze.com/ul?ll=${node.lat},${node.lon}&navigate=yes" target="_blank" class="msc-btn">🚗 Waze</a>`}
            </div>
          </div>
        `);

        elapsedMinutes += dwellMins;
      });

      document.getElementById('itineraryOutput').innerHTML = htmlCards.join('');
      document.getElementById('mapCardsStrip').innerHTML = bottomStripCards.join('');

      const totalMins = Math.round(totalDriveSec / 60);
      const timeFormatted = totalMins >= 60
        ? `${Math.floor(totalMins / 60)}h${String(totalMins % 60).padStart(2, '0')}`
        : `${totalMins} min`;
      const distFormatted = (totalDistMeters / 1000).toFixed(1).replace('.', ',') + ' km';

      document.getElementById('statDriveTime').textContent = timeFormatted;
      document.getElementById('statDistance').textContent = distFormatted;
      document.getElementById('statEndTime').textContent = addMinutesToTime(startTime, elapsedMinutes);
      updateDoneCounters();

      let drawnGeometry = null;
      try {
        const coordsStr = orderedNodes.map(pt => `${pt.lon},${pt.lat}`).join(';');
        const res = await fetch(`https://router.project-osrm.org/route/v1/driving/${coordsStr}?overview=full&geometries=geojson`);
        const data = await res.json();
        if (data.code === 'Ok' && data.routes && data.routes[0]) {
          drawnGeometry = data.routes[0].geometry.coordinates.map(c => [c[1], c[0]]);
        }
      } catch (e) {}

      if (!drawnGeometry) drawnGeometry = orderedNodes.map(pt => [pt.lat, pt.lon]);

      routeShadowLine = L.polyline(drawnGeometry, { color: '#FFFFFF', weight: 7, opacity: 0.9 }).addTo(map);
      routeMainLine = L.polyline(drawnGeometry, { color: '#1A73E8', weight: 4.5, opacity: 0.95 }).addTo(map);
      map.fitBounds(routeMainLine.getBounds(), { padding: [35, 35] });

      buildGoogleMapsExportLinks(orderedNodes);
    }

    function updateDoneCounters() {
      const totalStops = prospects.length;
      let doneCount = 0;
      currentOrderedNodes.forEach(n => {
        if (!n.isStart && doneAddresses[n.address]) doneCount++;
      });
      document.getElementById('doneProgressBadge').textContent = `${doneCount}/${totalStops}`;
      const distTxt = document.getElementById('statDistance').textContent;
      const driveTxt = document.getElementById('statDriveTime').textContent;
      document.getElementById('mapPillText').textContent = `${doneCount}/${totalStops} faits • ${driveTxt} (${distTxt})`;
    }

    function toggleStopDone(stepPos, address) {
      const nowDone = !doneAddresses[address];
      if (nowDone) doneAddresses[address] = true;
      else delete doneAddresses[address];
      saveProspects();

      const stopCard = document.getElementById(`stopCard-${stepPos}`);
      const listBadge = document.getElementById(`listBadge-${stepPos}`);
      const mscCard = document.getElementById(`mscCard-${stepPos}`);
      const mscNum = document.getElementById(`mscNum-${stepPos}`);
      const mscDoneBtn = document.getElementById(`mscDoneBtn-${stepPos}`);
      const mapPin = document.getElementById(`mapPin-${stepPos}`);

      if (stopCard) stopCard.classList.toggle('done', nowDone);
      if (listBadge) listBadge.textContent = nowDone ? '✓' : stepPos;
      if (mscCard) mscCard.classList.toggle('done-card', nowDone);
      if (mscNum) mscNum.textContent = nowDone ? '✓' : stepPos;
      if (mscDoneBtn) {
        mscDoneBtn.classList.toggle('is-done', nowDone);
        mscDoneBtn.textContent = nowDone ? '✓ Terminé' : '✅ Fait (Suivant →)';
      }
      if (mapPin) {
        mapPin.classList.toggle('done-pin', nowDone);
        mapPin.textContent = nowDone ? '✓' : stepPos;
      }

      updateDoneCounters();

      if (nowDone && document.getElementById(`mscCard-${stepPos + 1}`)) {
        setTimeout(() => scrollStripToStep(stepPos + 1), 220);
      }
    }

    function resetDoneStatus() {
      doneAddresses = {};
      saveProspects();
      optimizeRoute();
    }

    function selectStopFromList(stepPos) {
      if (window.innerWidth <= 920) switchMobileMode('map');
      if (stepPos === 0) {
        const m = mapMarkerRefs[0];
        if (m) map.flyTo(m.getLatLng(), 16, { duration: 0.5 });
      } else {
        scrollStripToStep(stepPos);
      }
    }

    function scrollStripToStep(stepPos) {
      const card = document.getElementById(`mscCard-${stepPos}`);
      const strip = document.getElementById('mapCardsStrip');
      if (card && strip) {
        isProgrammaticScroll = true;
        const targetLeft = card.offsetLeft - (strip.clientWidth - card.offsetWidth) / 2;
        strip.scrollTo({ left: targetLeft, behavior: 'smooth' });
        setTimeout(() => { isProgrammaticScroll = false; }, 450);
      }
      highlightActiveCardAndPin(stepPos, true);
    }

    function highlightActiveCardAndPin(stepPos, flyMap = true) {
      document.querySelectorAll('.map-stop-card').forEach(c => c.classList.remove('active-card'));
      const activeCard = document.getElementById(`mscCard-${stepPos}`);
      if (activeCard) activeCard.classList.add('active-card');

      const m = mapMarkerRefs[stepPos];
      if (m && flyMap) {
        map.flyTo(m.getLatLng(), 16, { duration: 0.45 });
      }
    }

    function buildGoogleMapsExportLinks(orderedNodes) {
      const exportBox = document.getElementById('exportBox');
      const container = document.getElementById('gmapsSegmentsContainer');
      exportBox.style.display = 'block';
      generatedGmapsUrls = [];

      const allWaypoints = orderedNodes.map(n => encodeURIComponent(n.address)).join('/');
      generatedGmapsUrls.push({ label: 'Toute la tournée', url: `https://www.google.com/maps/dir/${allWaypoints}` });

      if (orderedNodes.length > 10) {
        const chunkSize = 9;
        let partNum = 1;
        for (let i = 0; i < orderedNodes.length - 1; i += chunkSize) {
          const slice = orderedNodes.slice(i, i + chunkSize + 1);
          const url = 'https://www.google.com/maps/dir/' + slice.map(n => encodeURIComponent(n.address)).join('/');
          generatedGmapsUrls.push({
            label: `Partie ${partNum} (${i === 0 ? 1 : i}-${Math.min(i + chunkSize, orderedNodes.length - 1)})`,
            url
          });
          partNum++;
        }
      }

      container.innerHTML = generatedGmapsUrls.map((item, idx) => `
        <a href="${item.url}" target="_blank" rel="noopener noreferrer" class="btn ${idx === 0 ? 'btn-blue' : 'btn-outline'} btn-xs">
          🗺️ ${item.label}
        </a>
      `).join('');
    }

    function copyFirstGmapsLink() {
      if (generatedGmapsUrls.length === 0) return;
      navigator.clipboard.writeText(generatedGmapsUrls[0].url);
      alert('Lien Google Maps copié !');
    }

    window.addEventListener('DOMContentLoaded', () => {
      initMap();
      loadProspects();
      optimizeRoute();
    });
  </script>
</body>
</html>
