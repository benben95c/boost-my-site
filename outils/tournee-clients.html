<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Tournée — BoostMySite</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#FFFFFF">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="BMS Terrain">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="app-icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous"></script>
  <style>
    :root {
      --bg: #F9FAFB;
      --surface: #FFFFFF;
      --ink: #111827;
      --muted: #6B7280;
      --border: #E5E7EB;
      --blue: #2563EB;
      --blue-hover: #1D4ED8;
      --green: #16A34A;
      --amber: #D97706;
      --red: #DC2626;
      --font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      font-family: var(--font);
      color: var(--ink);
      background: var(--bg);
      height: 100%;
      height: 100dvh;
      width: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    /* VERROUILLAGE PIN SOBRE */
    .pin-lock-screen {
      position: fixed;
      inset: 0;
      background: #FFFFFF;
      color: var(--ink);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .pin-lock-screen.unlocked {
      display: none !important;
    }

    .pin-card {
      width: 100%;
      max-width: 300px;
      text-align: center;
    }

    .pin-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .pin-sub {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 20px;
    }

    .pin-dots {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 22px;
    }

    .pin-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 1.5px solid #D1D5DB;
      background: transparent;
    }

    .pin-dot.filled {
      background: var(--ink);
      border-color: var(--ink);
    }

    .pin-dot.error {
      background: var(--red);
      border-color: var(--red);
    }

    .pin-keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin: 0 auto 18px;
    }

    .pin-key {
      height: 52px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font);
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
    }

    .pin-key:active {
      background: #E5E7EB;
    }

    .pin-back-link {
      color: var(--muted);
      font-size: 12px;
      text-decoration: none;
    }

    /* HEADER SOBRE & PRO */
    header.app-header {
      padding-top: var(--safe-top);
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      z-index: 40;
      flex-shrink: 0;
    }

    .app-header-row {
      height: 48px;
      padding: 0 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .app-switch {
      display: inline-flex;
      background: #F3F4F6;
      padding: 3px;
      border-radius: 8px;
      gap: 2px;
    }

    .app-switch a {
      text-decoration: none;
      font-size: 12.5px;
      font-weight: 600;
      padding: 5px 12px;
      border-radius: 6px;
      color: var(--muted);
      white-space: nowrap;
    }

    .app-switch a.active {
      background: var(--surface);
      color: var(--ink);
      box-shadow: 0 1px 2px rgba(0,0,0,0.06);
    }

    /* BARRE DE PRIORITÉ DISCRÈTE INTÉGRÉE */
    .priority-inline-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--muted);
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 4px 10px;
      border-radius: 7px;
      cursor: pointer;
    }

    .priority-inline-bar strong {
      color: var(--ink);
      font-weight: 600;
    }

    .dot-live {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--green);
      flex-shrink: 0;
    }

    .top-right {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-top {
      padding: 6px 10px;
      border-radius: 7px;
      font-family: var(--font);
      font-size: 12px;
      font-weight: 600;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--ink);
      text-decoration: none;
      cursor: pointer;
      white-space: nowrap;
    }

    .btn-top:hover {
      background: var(--bg);
    }

    .btn-top-primary {
      background: var(--ink);
      color: #fff;
      border-color: var(--ink);
    }

    .btn-top-primary:hover {
      background: #1F2937;
    }

    .btn-top-danger {
      color: var(--red);
    }

    /* BARRE DE PRIORITÉ MOBILE SOUS LE HEADER */
    .mobile-priority-strip {
      display: none;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      padding: 6px 12px;
      font-size: 11.5px;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-shrink: 0;
    }

    /* WORKSPACE */
    .workspace {
      flex: 1;
      display: grid;
      grid-template-columns: 400px 1fr;
      overflow: hidden;
      position: relative;
    }

    /* SIDEBAR */
    .sidebar {
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      z-index: 30;
    }

    .sheet-mobile-header {
      display: none;
    }

    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
      padding: 4px;
      gap: 4px;
      flex-shrink: 0;
    }

    .tab-btn {
      padding: 8px 10px;
      border: none;
      background: transparent;
      font-family: var(--font);
      font-size: 12.5px;
      font-weight: 600;
      color: var(--muted);
      border-radius: 6px;
      cursor: pointer;
    }

    .tab-btn.active {
      background: var(--surface);
      color: var(--ink);
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    }

    .tab-pane {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 12px;
      display: none;
    }

    .tab-pane.active {
      display: block;
    }

    /* TRI TRAJET VS PRIORITÉ */
    .mode-switch-bar {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: #F3F4F6;
      padding: 3px;
      border-radius: 8px;
      margin-bottom: 10px;
      gap: 2px;
    }

    .mode-switch-btn {
      border: none;
      background: transparent;
      padding: 7px 6px;
      border-radius: 6px;
      font-family: var(--font);
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
    }

    .mode-switch-btn.active {
      background: var(--surface);
      color: var(--ink);
      box-shadow: 0 1px 2px rgba(0,0,0,0.06);
    }

    .section-box {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
    }

    .section-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: var(--ink);
      margin-bottom: 4px;
    }

    input[type="text"],
    input[type="time"],
    select,
    textarea {
      width: 100%;
      padding: 9px 11px;
      border: 1px solid var(--border);
      border-radius: 7px;
      font-family: var(--font);
      font-size: 16px;
      color: var(--ink);
      background: #fff;
      outline: none;
    }

    textarea {
      min-height: 76px;
      resize: vertical;
      line-height: 1.4;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 8px 12px;
      border-radius: 7px;
      font-family: var(--font);
      font-size: 12px;
      font-weight: 600;
      border: 1px solid transparent;
      cursor: pointer;
      text-decoration: none;
      white-space: nowrap;
    }

    .btn-blue { background: var(--blue); color: #fff; }
    .btn-dark { background: var(--ink); color: #fff; }
    .btn-outline { background: #fff; color: var(--ink); border-color: var(--border); }
    .btn-danger { background: #fff; color: var(--red); border-color: var(--border); }
    .btn-xs { padding: 5px 9px; font-size: 11.5px; border-radius: 6px; }

    .client-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 260px;
      overflow-y: auto;
      margin-top: 10px;
    }

    .client-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      background: #fff;
      border: 1px solid var(--border);
      padding: 8px 10px;
      border-radius: 7px;
      font-size: 12.5px;
    }

    .client-row strong {
      display: block;
      font-size: 12.5px;
      font-weight: 600;
    }

    .client-row span {
      color: var(--muted);
      font-size: 11px;
    }

    .sidebar-footer {
      padding: 10px 12px;
      border-top: 1px solid var(--border);
      background: var(--surface);
      flex-shrink: 0;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-bottom: 10px;
    }

    .stat-card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 7px 6px;
      text-align: center;
    }

    .stat-card span {
      display: block;
      font-size: 10.5px;
      color: var(--muted);
      font-weight: 500;
    }

    .stat-card strong {
      font-size: 13px;
      font-weight: 700;
    }

    /* LISTE DES ÉTAPES */
    .timeline {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-bottom: 24px;
    }

    .stop-item {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 11px;
      display: grid;
      grid-template-columns: 26px 1fr;
      gap: 10px;
      cursor: pointer;
    }

    .stop-item:hover {
      border-color: #CBD5E1;
    }

    .stop-item.active-list-item {
      border-color: var(--blue);
      box-shadow: 0 0 0 1px var(--blue);
    }

    .stop-item.done {
      opacity: 0.5;
      background: var(--bg);
    }

    .badge-num {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: var(--blue);
      color: #fff;
      font-weight: 700;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 1px;
    }

    .stop-item.done .badge-num { background: var(--green); }
    .badge-num.start { background: var(--ink); }

    .stop-meta-line {
      font-size: 11.5px;
      color: var(--muted);
      margin-top: 2px;
    }

    .stop-status-line {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 5px;
      font-size: 11.5px;
      font-weight: 500;
      color: var(--ink);
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 2px 7px;
      border-radius: 5px;
      font-size: 11px;
      font-weight: 600;
      background: #F3F4F6;
      color: #374151;
    }

    .status-pill.indep { background: #F0FDF4; color: #15803D; }
    .status-pill.reseau { background: #FFFBEB; color: #B45309; }
    .status-pill.franchise { background: #FEF2F2; color: #B91C1C; }

    .stop-note {
      font-size: 11.5px;
      color: var(--muted);
      margin-top: 5px;
      line-height: 1.35;
    }

    .stop-actions {
      display: flex;
      gap: 5px;
      margin-top: 8px;
      flex-wrap: wrap;
    }

    /* MAP AREA */
    .map-Area {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    #map {
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* BOUTONS CARTE À DROITE (AUCUN ÉLÉMENT SUR LE + / - À GAUCHE) */
    .map-right-dock {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 500;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .map-ctrl-btn {
      background: rgba(255, 255, 255, 0.96);
      border: 1px solid var(--border);
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      border-radius: 7px;
      padding: 7px 10px;
      font-family: var(--font);
      font-size: 12px;
      font-weight: 600;
      color: var(--ink);
      cursor: pointer;
    }

    .map-ctrl-btn:hover {
      background: #fff;
    }

    /* SUR ORDINATEUR (> 920px) : PAS DE CARROUSEL GÉANT QUI CACHE LA CARTE (LA LISTE EST DÉJÀ À GAUCHE) */
    .map-bottom-wrapper {
      display: none;
    }

    /* MODAL AUTO-SCANNER SOBRE */
    .scanner-modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(17, 24, 39, 0.45);
      z-index: 900;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .scanner-modal-backdrop.open {
      display: flex;
    }

    .scanner-sheet {
      width: 100%;
      max-width: 520px;
      max-height: 85dvh;
      background: var(--surface);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.2);
    }

    .scanner-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
    }

    .sector-chips {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 2px;
      scrollbar-width: none;
    }

    .sector-chips::-webkit-scrollbar { display: none; }

    .sector-chip {
      padding: 6px 11px;
      border-radius: 7px;
      border: 1px solid var(--border);
      background: var(--bg);
      font-family: var(--font);
      font-size: 12px;
      font-weight: 600;
      color: var(--ink);
      white-space: nowrap;
      cursor: pointer;
    }

    .sector-chip.active {
      background: var(--ink);
      color: #fff;
      border-color: var(--ink);
    }

    .radius-chips {
      display: flex;
      gap: 5px;
      align-items: center;
    }

    .radius-chip {
      padding: 4px 9px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #fff;
      font-family: var(--font);
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
    }

    .radius-chip.active {
      background: var(--blue);
      color: #fff;
      border-color: var(--blue);
    }

    .scanner-results-list {
      flex: 1;
      overflow-y: auto;
      max-height: 40dvh;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .scan-item-card {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 9px 11px;
      background: var(--bg);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    /* MAP PINS */
    .g-pin {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: var(--blue);
      color: #fff;
      border: 2px solid #fff;
      box-shadow: 0 2px 5px rgba(0,0,0,0.3);
      font-weight: 700;
      font-size: 11.5px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .g-pin.cash-king-pin {
      background: var(--ink);
      width: 30px;
      height: 30px;
      border: 2px solid #fff;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.35), 0 3px 8px rgba(0,0,0,0.35);
    }

    .g-pin.done-pin { background: var(--green); }
    .g-pin.start { background: var(--ink); width: 28px; height: 28px; }

    .gps-user-dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--blue);
      border: 3px solid #fff;
      box-shadow: 0 0 0 5px rgba(37, 99, 235, 0.25);
    }

    .mobile-bottom-nav {
      display: none;
    }

    /* ==========================================================
       VERSION MOBILE (< 920px)
       ========================================================== */
    @media (max-width: 920px) {
      .app-header-row {
        height: 46px;
        padding: 0 10px;
      }

      .hide-on-mobile {
        display: none !important;
      }

      .priority-inline-bar {
        display: none;
      }

      .mobile-priority-strip {
        display: flex;
      }

      .workspace {
        display: block;
        position: relative;
        width: 100%;
        flex: 1;
      }

      .map-Area {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
      }

      .leaflet-control-attribution {
        display: none !important;
      }

      .map-right-dock {
        top: 10px;
        right: 10px;
        gap: 5px;
      }

      .map-ctrl-btn {
        padding: 6px 9px;
        font-size: 11.5px;
      }

      .sidebar {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 600;
        border-right: none;
        transform: translateY(105%);
        transition: transform 0.22s ease;
      }

      .sidebar.mobile-sheet-open {
        transform: translateY(0);
      }

      .sidebar .tabs {
        display: none;
      }

      .client-list {
        max-height: none;
      }

      .sheet-mobile-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 12px;
        border-bottom: 1px solid var(--border);
        background: var(--surface);
        flex-shrink: 0;
      }

      .sheet-mobile-header strong {
        font-size: 14px;
      }

      /* FICHE EN BAS DE CARTE UNIQUEMENT SUR MOBILE */
      .map-bottom-wrapper {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 8px;
        z-index: 500;
        display: flex;
        flex-direction: column;
        pointer-events: none;
      }

      .map-bottom-wrapper > * {
        pointer-events: auto;
      }

      .map-bottom-wrapper.collapsed .map-cards-strip {
        display: none;
      }

      .card-collapse-pill {
        align-self: center;
        background: var(--surface);
        color: var(--ink);
        border: 1px solid var(--border);
        border-radius: 99px;
        padding: 4px 12px;
        font-family: var(--font);
        font-size: 11px;
        font-weight: 600;
        margin-bottom: 5px;
        cursor: pointer;
        box-shadow: 0 2px 6px rgba(0,0,0,0.12);
      }

      .map-cards-strip {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        scroll-snap-type: x mandatory;
        padding: 2px 10px 4px;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
      }

      .map-cards-strip::-webkit-scrollbar { display: none; }

      .map-stop-card {
        flex: 0 0 calc(100vw - 20px);
        max-width: 390px;
        scroll-snap-align: center;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 11px;
        padding: 10px 11px;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.14);
        display: flex;
        flex-direction: column;
        gap: 5px;
      }

      .map-stop-card.done-card {
        background: #F9FAFB;
      }

      .msc-header-nav {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 11px;
        font-weight: 600;
        color: var(--muted);
      }

  <script>
    const DEV_PIN_STORAGE_KEY = 'bms_dev_auth_v1';
    const REQUIRED_PIN = '9595';
    let enteredPin = '';

    function checkDevAuth() {
      try {
        if (localStorage.getItem(DEV_PIN_STORAGE_KEY) === REQUIRED_PIN) {
          document.getElementById('pinLockScreen').classList.add('unlocked');
          return true;
        }
      } catch (e) {}
      return false;
    }

    function updatePinDots(isError = false) {
      for (let i = 0; i < 4; i++) {
        const dot = document.getElementById('pDot' + i);
        dot.classList.toggle('filled', i < enteredPin.length && !isError);
        dot.classList.toggle('error', isError);
      }
    }

    function pressPin(digit) {
      if (enteredPin.length >= 4) return;
      enteredPin += digit;
      updatePinDots(false);
      if (enteredPin.length === 4) {
        if (enteredPin === REQUIRED_PIN) {
          try { localStorage.setItem(DEV_PIN_STORAGE_KEY, REQUIRED_PIN); } catch (e) {}
          document.getElementById('pinLockScreen').classList.add('unlocked');
          setTimeout(() => { if (map) map.invalidateSize(); }, 100);
        } else {
          updatePinDots(true);
          setTimeout(() => {
            enteredPin = '';
            updatePinDots(false);
          }, 400);
        }
      }
    }

    function backspacePin() {
      enteredPin = enteredPin.slice(0, -1);
      updatePinDots(false);
    }

    function clearPin() {
      enteredPin = '';
      updatePinDots(false);
    }

    window.addEventListener('keydown', (e) => {
      const lock = document.getElementById('pinLockScreen');
      if (!lock || lock.classList.contains('unlocked')) return;
      if (e.key >= '0' && e.key <= '9') pressPin(e.key);
      else if (e.key === 'Backspace') backspacePin();
    });

    const STORAGE_KEY = 'bms_route_prospects_v6';
    const DONE_STORAGE_KEY = 'bms_route_done_v6';
    const CLEARED_FLAG_KEY = 'bms_route_cleared_v6';

    const FRANCHISE_BRANDS = [
      'chicken street', 'o\'tacos', 'otacos', 'mcdo', 'mcdonald', 'burger king', 'kfc',
      'domino', 'pizza hut', 'pizza rabb', 'subway', 'pitaya', 'pokawa', 'g la dalle',
      'point b', 'big m', 'chikin', 'cote sushi', 'côté sushi', 'planet sushi', 'sushi shop',
      'eat sushi', 'lady sushi', 'paul ', 'brioche doree', 'marie blachere', 'ange ',
      'carrefour', 'franprix', 'coccimarket', 'cocci market', 'monoprix', 'auchan', 'leclerc',
      'intermarche', 'lidl', 'aldi', 'picard', 'biocoop', 'naturalia', 'nicolas',
      'franck provost', 'jean louis david', 'saint algue', 'camille albane', 'tchip', 'coiff&co',
      'yves rocher', 'body minute', 'sephora', 'marionnaud', 'nocibe',
      'midas', 'speedy', 'norauto', 'feu vert', 'carglass', 'euromaster', 'point s',
      'century 21', 'orpi', 'laforet', 'stephane plaza', 'guy hoquet', 'foncia',
      'elior', 'sodexo', 'compass', 'flunch', 'hippopotamus', 'buffalo grill', 'del arte',
      'leon de bruxelles', 'courtepaille', 'au bureau', 'columbus'
    ];

    const MINI_CHAIN_BRANDS = [
      'pepper smash', 'be\'sushi', 'be sushi', 'atelier du sushi'
    ];

    let prospects = [];
    let doneAddresses = {};
    let lastScannedProspects = [];
    let currentScanSector = 'resto';
    let currentScanRadius = 2;
    let sortMode = 'route';
    let map, currentTileLayer, markersLayer, routeShadowLine, routeMainLine, userLocationMarker;
    let userGpsCoords = null;
    let isSatellite = false;
    let mapMarkerRefs = [];
    let cachedGeoNodes = [];
    let cachedDurations = [];
    let cachedDistances = [];
    let currentOrderedNodes = [];
    let generatedGmapsUrls = [];
    let topCashStepPos = 1;
    let isProgrammaticScroll = false;

    const TILE_LAYERS = {
      roadmap: 'https://mt1.google.com/vt/lyrs=m&hl=fr&x={x}&y={y}&z={z}',
      hybrid: 'https://mt1.google.com/vt/lyrs=y&hl=fr&x={x}&y={y}&z={z}'
    };

    function initMap() {
      map = L.map('map', { zoomControl: true }).setView([49.048, 2.092], 13);
      currentTileLayer = L.tileLayer(TILE_LAYERS.roadmap, { maxZoom: 20 }).addTo(map);
      markersLayer = L.layerGroup().addTo(map);

      const strip = document.getElementById('mapCardsStrip');
      let scrollTimer = null;
      strip.addEventListener('scroll', () => {
        if (isProgrammaticScroll) return;
        clearTimeout(scrollTimer);
        scrollTimer = setTimeout(() => {
          const cards = Array.from(strip.querySelectorAll('.map-stop-card'));
          if (!cards.length) return;
          const stripCenter = strip.scrollLeft + strip.clientWidth / 2;
          let closest = null;
          let minDelta = Infinity;
          cards.forEach(c => {
            const cCenter = c.offsetLeft + c.offsetWidth / 2;
            const d = Math.abs(cCenter - stripCenter);
            if (d < minDelta) { minDelta = d; closest = c; }
          });
          if (closest) {
            highlightActiveCardAndPin(parseInt(closest.dataset.step, 10), true);
          }
        }, 120);
      }, { passive: true });

      setInterval(() => {
        if (cachedGeoNodes.length > 1) {
          refreshLiveCashDetector();
        }
      }, 30000);
    }

    function toggleBottomCardsCollapse() {
      const wrap = document.getElementById('mapBottomWrapper');
      const btn = document.getElementById('cardCollapseBtn');
      const collapsed = wrap.classList.toggle('collapsed');
      btn.textContent = collapsed ? 'Afficher la fiche' : 'Masquer la fiche';
    }

    function detectFranchiseStatus(name, explicitStatus, nbEtab = 1) {
      if (explicitStatus) return explicitStatus;
      const lower = String(name || '').toLowerCase();
      for (const brand of FRANCHISE_BRANDS) {
        if (lower.includes(brand)) return 'franchise';
      }
      for (const mini of MINI_CHAIN_BRANDS) {
        if (lower.includes(mini)) return 'reseau';
      }
      if (nbEtab >= 5) return 'franchise';
      if (nbEtab >= 2) return 'reseau';
      return 'indep';
    }

    function evaluateRealTimeProspectPriority(node, refPoint) {
      const now = new Date();
      const hourDec = now.getHours() + now.getMinutes() / 60;
      const category = node.category || inferCategory(node.name, node.pitch);
      const potentialEur = node.potentialEur || (node.pack === 'starter' ? 490 : 990);
      const franchiseStatus = detectFranchiseStatus(node.name, node.franchiseStatus, node.nbEtab || 1);

      let baseWinProb = node.winProb || (node.pack === 'pro' ? 84 : 78);
      let franchiseMultiplier = 1.0;
      let statusLabel = 'Indépendant';

      if (franchiseStatus === 'franchise') {
        baseWinProb = Math.min(baseWinProb, 20);
        franchiseMultiplier = 0.22;
        statusLabel = 'Franchise';
      } else if (franchiseStatus === 'reseau') {
        baseWinProb = Math.min(baseWinProb, 42);
        franchiseMultiplier = 0.52;
        statusLabel = 'Réseau';
      } else {
        franchiseMultiplier = 1.25;
        statusLabel = 'Indépendant';
      }

      let timeMultiplier = 1.0;
      let timeBadgeText = 'Horaires adaptés';
      let isRush = false;

      if (category === 'resto') {
        if (hourDec >= 11.9 && hourDec <= 14.15) {
          timeMultiplier = 0.58;
          timeBadgeText = 'Service midi en cours';
          isRush = true;
        } else if (hourDec >= 19.0 && hourDec <= 21.5) {
          timeMultiplier = 0.62;
          timeBadgeText = 'Service soir en cours';
          isRush = true;
        } else if ((hourDec >= 9.5 && hourDec < 11.9) || (hourDec > 14.15 && hourDec < 19.0)) {
          timeMultiplier = 1.2;
          timeBadgeText = 'Hors service';
        }
      } else if (category === 'artisan') {
        if (hourDec >= 11.8 && hourDec <= 14.2) {
          timeMultiplier = 1.35;
          timeBadgeText = 'Disponible ce midi';
        } else if (hourDec >= 8.5 && hourDec <= 18.5) {
          timeMultiplier = 1.15;
          timeBadgeText = 'Ouvert';
        }
      } else {
        if (hourDec >= 9.5 && hourDec <= 18.0) {
          timeMultiplier = 1.1;
          timeBadgeText = 'Ouvert';
        }
      }

      let distKm = 2.0;
      if (refPoint && node.lat && node.lon) {
        distKm = (haversineMeters(refPoint, node) * 1.28) / 1000;
      }
      const proximityBonus = Math.max(0.72, 1.25 - (distKm * 0.06));

      const rawScore = (potentialEur / 10) * (baseWinProb / 100) * franchiseMultiplier * timeMultiplier * proximityBonus;
      const displayScore = Math.min(95, Math.max(15, Math.round(baseWinProb * (timeMultiplier > 1 ? 1.04 : (isRush ? 0.82 : 1.0)))));

      return {
        potentialEur,
        displayScore,
        rawScore,
        timeBadgeText,
        isRush,
        distKm,
        franchiseStatus,
        statusLabel
      };
    }

      if (s.includes('parquet') || s.includes('artisan') || s.includes('market') || s.includes('garage') || s.includes('auto') || s.includes('plomb') || s.includes('menuis')) {

      if (s.includes('institut') || s.includes('massage') || s.includes('cabinet') || s.includes('coiff') || s.includes('beauté')) {
        return 'beaute';
      }
      return 'resto';
    }

    async function runMapProspectScanner() {
      const sectorKey = currentScanSector || 'resto';
      const radiusKm = currentScanRadius || 2;
      const excludeFranchises = document.getElementById('scanExcludeFranchises').checked;
      const statusEl = document.getElementById('scannerStatusText');
      const listEl = document.getElementById('scannerResultsList');

      const center = map.getCenter();
      const cfg = SECTOR_CONFIG[sectorKey] || SECTOR_CONFIG.resto;

      statusEl.textContent = `Recherche dans un rayon de ${radiusKm} km...`;
      listEl.innerHTML = '';

      try {
        const pages = [1, 2, 3];
        const responses = await Promise.all(
          pages.map(p =>
            fetch(`https://recherche-entreprises.api.gouv.fr/near_point?lat=${center.lat.toFixed(5)}&long=${center.lng.toFixed(5)}&radius=${radiusKm}&activite_principale=${cfg.naf}&per_page=25&page=${p}`)
              .then(r => r.json())
              .catch(() => ({ results: [] }))
          )
        );

        const rawResults = responses.flatMap(r => r.results || []);
        const discovered = [];
        const seenNames = new Set();

        for (const item of rawResults) {
          if (item.etat_administratif && item.etat_administratif !== 'A') continue;
          const nbEtab = item.nombre_etablissements_ouverts || 1;
          const m = (item.matching_etablissements && item.matching_etablissements[0]) || item.siege;
          if (!m || !m.adresse) continue;

          const rawName = (m.liste_enseignes && m.liste_enseignes[0]) || m.nom_commercial || item.nom_complet || '';
          const cleanName = formatBusinessName(rawName);
          if (!cleanName || seenNames.has(cleanName.toLowerCase())) continue;

          const fStatus = detectFranchiseStatus(cleanName, null, nbEtab);
          if (excludeFranchises && fStatus !== 'indep') continue;

          let bossName = '';
          if (item.dirigeants && item.dirigeants.length > 0) {
            const d = item.dirigeants[0];
            if (d.prenoms || d.nom) {
              bossName = `${formatBusinessName(d.prenoms || '')} ${formatBusinessName(d.nom || '')}`.trim();
            }
          }

          const yearCreated = item.date_creation ? item.date_creation.slice(0, 4) : '';
          const isRecent = yearCreated && parseInt(yearCreated, 10) >= 2022;
          const winProb = fStatus === 'indep' ? (isRecent ? 90 : 84) : (fStatus === 'reseau' ? 42 : 20);

          const lat = parseFloat(m.latitude);
          const lon = parseFloat(m.longitude);
          if (isNaN(lat) || isNaN(lon)) continue;

          seenNames.add(cleanName.toLowerCase());

          const pitchParts = [
            bossName ? `Gérant : ${bossName}` : `Indépendant`,
            yearCreated ? `Créé en ${yearCreated}` : '',
            cfg.pitchLabel
          ].filter(Boolean).join(' · ');

          discovered.push({
            name: cleanName,
            address: formatAddressCase(m.adresse),
            phone: '',
            pitch: pitchParts,
            demo: cfg.demo,
            pack: cfg.pack,
            category: cfg.category,
            potentialEur: cfg.potentialEur,
            winProb,
            franchiseStatus: fStatus,
            nbEtab,
            bossName,
            yearCreated,
            lat,
            lon
          });

          if (discovered.length >= 16) break;
        }

        lastScannedProspects = discovered;

        if (discovered.length === 0) {
          statusEl.textContent = `Aucun résultat dans ce rayon. Passez à 4 km ou déplacez la carte.`;
          return;
        }

        statusEl.textContent = `${discovered.length} établissements trouvés :`;
        listEl.innerHTML = discovered.map((p, idx) => `
          <div class="scan-item-card">
            <div style="min-width:0; flex:1;">
              <div style="font-size:13px; font-weight:600; color:var(--ink);">${idx + 1}. ${escHtml(p.name)}</div>
              <div style="font-size:11px; color:var(--muted);">${escHtml(p.address)}</div>
              <div style="font-size:11px; color:var(--ink); margin-top:3px;">
                <span class="status-pill ${p.franchiseStatus}">${p.franchiseStatus === 'indep' ? 'Indépendant' : 'Réseau'}</span>
                <span style="margin-left:4px; color:var(--muted);">${p.potentialEur} € · ${p.winProb}%${p.bossName ? ' · Gérant : ' + escHtml(p.bossName) : ''}</span>
              </div>
            </div>
            <button type="button" class="btn btn-outline btn-xs" onclick="addSingleScannedProspect(${idx}, this)">Ajouter</button>
          </div>
        `).join('');
      } catch (e) {
        statusEl.textContent = `Erreur réseau lors de la recherche.`;
      }
    }

    function addFromBulk() {
      const textarea = document.getElementById('bulkInput');
      const rawText = textarea.value.trim();
      if (!rawText) return;

      localStorage.removeItem(CLEARED_FLAG_KEY);

      rawText.split('\n').forEach(line => {
        let cleaned = line.trim().replace(/^Client\s*:\s*/i, '');
        if (!cleaned) return;
        for (const sep of [' - ', ' | ', ' — ', ';']) {
          if (cleaned.includes(sep)) {
            const p = cleaned.split(sep);
            const name = p.shift().trim();
            const address = p.join(sep).trim();
            prospects.push({
              name: name || address,
              address: address || name,
              pack: 'pro',
              potentialEur: 990,
              winProb: 84
            });
            return;
          }
        }
        prospects.push({
          name: cleaned.split(',')[0].trim(),
          address: cleaned,
          pack: 'pro',
          potentialEur: 990,
          winProb: 84
        });
      });

      textarea.value = '';
      saveProspects();
      renderRawProspects();
      optimizeRoute();
    }

    function removeProspectByIndex(idx) {
      if (idx < 0 || idx >= prospects.length) return;
      const removed = prospects.splice(idx, 1)[0];
      if (prospects.length === 0) {
        localStorage.setItem(CLEARED_FLAG_KEY, '1');
      }
      saveProspects();
      renderRawProspects();

      if (removed && cachedGeoNodes.length > 1) {
        const nodeIdx = cachedGeoNodes.findIndex((n, i) => i > 0 && n.name === removed.name);
        if (nodeIdx !== -1) {
          cachedGeoNodes.splice(nodeIdx, 1);
          cachedDurations.splice(nodeIdx, 1);
          cachedDurations.forEach(row => row.splice(nodeIdx, 1));
          cachedDistances.splice(nodeIdx, 1);
          cachedDistances.forEach(row => row.splice(nodeIdx, 1));
          if (prospects.length === 0) {
            clearMapAndUIOnly();
          } else {
            rebuildDisplayFromCache();
          }
          return;
        }
      }
      if (prospects.length === 0) {
        clearMapAndUIOnly();
      } else {
        optimizeRoute();
      }
    }

    function haversineMeters(a, b) {
      const R = 6371000;
      const toRad = d => d * Math.PI / 180;
      const dLat = toRad(b.lat - a.lat);
      const dLon = toRad(b.lon - a.lon);
      const s = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(a.lat)) * Math.cos(toRad(b.lat)) * Math.sin(dLon / 2) ** 2;
      return 2 * R * Math.asin(Math.sqrt(s));
    }

    async function geocodeSmart(rawQuery, biasGeo = null) {
      const cleanQuery = rawQuery.replace(/^Client\s*:\s*/i, '').trim();
      const gpsMatch = cleanQuery.match(/^\s*(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)\s*$/);
      if (gpsMatch) {
        return { lat: parseFloat(gpsMatch[1]), lon: parseFloat(gpsMatch[2]), label: cleanQuery };
      }

      const candidates = [cleanQuery];
      if (cleanQuery.includes(',')) {
        const afterComma = cleanQuery.split(',').slice(1).join(',').trim();
        if (afterComma.length > 5) candidates.push(afterComma);
      }

      let bestMatch = null;
      let bestDist = Infinity;

      for (const q of candidates) {
        let url = `https://api-adresse.data.gouv.fr/search/?q=${encodeURIComponent(q)}&limit=5`;
        if (biasGeo && biasGeo.lat && biasGeo.lon) url += `&lat=${biasGeo.lat}&lon=${biasGeo.lon}`;
        try {
          const res = await fetch(url);
          const data = await res.json();
          if (data.features && data.features.length > 0) {
            for (const feat of data.features) {
              const pt = {
                lon: feat.geometry.coordinates[0],
                lat: feat.geometry.coordinates[1],
                label: feat.properties.label
              };
              if (!biasGeo) return pt;
              const d = haversineMeters(biasGeo, pt);
              if (d < bestDist) { bestDist = d; bestMatch = pt; }
              if (d < 25000) return pt;
            }
          }
        } catch (e) {}
      }
      if (bestMatch) return bestMatch;
      throw new Error('Adresse introuvable : ' + rawQuery);
    }

    function solveTSP(matrix, returnToStart) {
      const n = matrix.length;
      const visited = new Array(n).fill(false);
      visited[0] = true;
      const order = [0];

      for (let step = 1; step < n; step++) {
        const last = order[order.length - 1];
        let bestNext = -1;
        let bestCost = Infinity;
        for (let c = 1; c < n; c++) {
          if (!visited[c] && matrix[last][c] < bestCost) {
            bestCost = matrix[last][c];
            bestNext = c;
          }
        }
        visited[bestNext] = true;
        order.push(bestNext);
      }
      if (returnToStart) order.push(0);

      function routeCost(seq) {
        let total = 0;
        for (let i = 0; i < seq.length - 1; i++) total += matrix[seq[i]][seq[i + 1]];
        return total;
      }

      const endLimit = returnToStart ? order.length - 2 : order.length - 1;
      let improved = true;
      while (improved) {
        improved = false;
        for (let i = 1; i < endLimit; i++) {
          for (let k = i + 1; k <= endLimit; k++) {
            const candidate = order.slice(0, i).concat(order.slice(i, k + 1).reverse()).concat(order.slice(k + 1));
            if (routeCost(candidate) + 0.05 < routeCost(order)) {
              for (let m = 0; m < order.length; m++) order[m] = candidate[m];
              improved = true;
            }
          }
        }
      }
      return order;
    }

    function addMinutesToTime(timeStr, minsToAdd) {
      const [hh, mm] = (timeStr || '14:00').split(':').map(Number);
      const total = hh * 60 + mm + Math.round(minsToAdd);
      const h = Math.floor((total / 60) % 24);
      const m = total % 60;
      return String(h).padStart(2, '0') + 'h' + String(m).padStart(2, '0');
    }

    async function optimizeRoute() {
      if (document.getElementById('bulkInput').value.trim()) {
        addFromBulk();
        return;
      }
      if (prospects.length === 0) {
        clearMapAndUIOnly();
        return;
      }
      const startAddr = document.getElementById('startAddress').value.trim();
      if (!startAddr) return;

      const btn = document.getElementById('btnOptimize');
      const status = document.getElementById('statusMsg');
      btn.disabled = true;

      try {
        let startGeo;
        if (startAddr.includes('15 Rue des Écuries') && startAddr.includes('95300')) {
          startGeo = { lat: 49.04143, lon: 2.085911, label: startAddr };
        } else {
          startGeo = await geocodeSmart(startAddr, null);
        }

        const nodes = [{
          isStart: true,
          name: 'Départ',
          address: startGeo.label,
          rawAddress: startAddr,
          lat: startGeo.lat,
          lon: startGeo.lon
        }];

        for (let i = 0; i < prospects.length; i++) {
          let lat = prospects[i].lat;
          let lon = prospects[i].lon;
          let label = prospects[i].address;

          if (!lat || !lon) {
            status.textContent = `Localisation (${i + 1}/${prospects.length})...`;
            const g = await geocodeSmart(prospects[i].address, startGeo);
            lat = g.lat;
            lon = g.lon;
            label = g.label;
            prospects[i].lat = lat;
            prospects[i].lon = lon;
          }

          nodes.push({
            isStart: false,
            name: prospects[i].name,
            address: label,
            rawAddress: prospects[i].address,
            phone: prospects[i].phone || '',
            pitch: prospects[i].pitch || '',
            demo: prospects[i].demo || '../sites/fastfood-smash.html',
            pack: prospects[i].pack || 'pro',
            category: prospects[i].category || inferCategory(prospects[i].name, prospects[i].pitch),
            franchiseStatus: detectFranchiseStatus(prospects[i].name, prospects[i].franchiseStatus, prospects[i].nbEtab || 1),
            nbEtab: prospects[i].nbEtab || 1,
            potentialEur: prospects[i].potentialEur || (prospects[i].pack === 'starter' ? 490 : 990),
            winProb: prospects[i].winProb || 84,
            lat,
            lon
          });
        }

        saveProspects();

        const mode = document.getElementById('travelMode').value;
        const speedKmh = mode === 'foot' ? 4.8 : (mode === 'bike' ? 16.5 : 28);
        const n = nodes.length;
        const durations = Array.from({ length: n }, () => new Array(n).fill(0));
        const distances = Array.from({ length: n }, () => new Array(n).fill(0));

        try {
          const coordsStr = nodes.map(pt => `${pt.lon},${pt.lat}`).join(';');
          const res = await fetch(`https://router.project-osrm.org/table/v1/driving/${coordsStr}?annotations=duration,distance`);
          const data = await res.json();
          if (data.code === 'Ok' && data.distances) {
            for (let i = 0; i < n; i++) {
              for (let j = 0; j < n; j++) {
                const distM = data.distances[i][j] ?? (haversineMeters(nodes[i], nodes[j]) * 1.28);
                distances[i][j] = distM;
                durations[i][j] = (mode === 'driving' && data.durations && data.durations[i][j])
                  ? data.durations[i][j]
                  : (distM / 1000) / speedKmh * 3600;
              }
            }
          } else {
            throw new Error('Fallback');
          }
        } catch (e) {
          for (let i = 0; i < n; i++) {
            for (let j = 0; j < n; j++) {
              if (i === j) continue;
              const roadM = haversineMeters(nodes[i], nodes[j]) * 1.28;
              distances[i][j] = roadM;
              durations[i][j] = (roadM / 1000) / speedKmh * 3600;
            }
          }
        }

        cachedGeoNodes = nodes;
        cachedDurations = durations;
        cachedDistances = distances;

        await rebuildDisplayFromCache();
        switchView('route');
        if (window.innerWidth <= 920) switchMobileMode('map');
        status.textContent = '';
      } catch (err) {
        alert(err.message || 'Erreur de localisation.');
      } finally {
        btn.disabled = false;
      }
    }

    async function rebuildDisplayFromCache() {
      const nodes = cachedGeoNodes;
      const durations = cachedDurations;
      const distances = cachedDistances;
      if (!nodes || nodes.length <= 1) {
        clearMapAndUIOnly();
        return;
      }

      const refPoint = userGpsCoords || nodes[0];
      for (let i = 1; i < nodes.length; i++) {
        nodes[i].liveEval = evaluateRealTimeProspectPriority(nodes[i], refPoint);
      }

      const returnToStart = document.getElementById('returnToStart').checked;
      let order;

      if (sortMode === 'cash') {
        const indices = [];
        for (let i = 1; i < nodes.length; i++) indices.push(i);
        indices.sort((a, b) => {
          const doneA = Boolean(doneAddresses[nodes[a].address]);
          const doneB = Boolean(doneAddresses[nodes[b].address]);
          if (doneA !== doneB) return doneA ? 1 : -1;
          return nodes[b].liveEval.rawScore - nodes[a].liveEval.rawScore;
        });
        order = [0, ...indices];
        if (returnToStart) order.push(0);
      } else {
        order = solveTSP(durations, returnToStart);
      }

      await renderOptimizedMapAndList(nodes, order, durations, distances);
    }

    async function renderOptimizedMapAndList(nodes, order, durations, distances) {
      markersLayer.clearLayers();
      mapMarkerRefs = [];
      if (routeShadowLine) map.removeLayer(routeShadowLine);
      if (routeMainLine) map.removeLayer(routeMainLine);

      const startTime = document.getElementById('startTime').value || '14:00';
      const dwellMins = parseInt(document.getElementById('dwellMinutes').value, 10) || 15;
      const mode = document.getElementById('travelMode').value;
      const gmapsTravelMode = mode === 'foot' ? 'walking' : (mode === 'bike' ? 'bicycling' : 'driving');

      let totalDriveSec = 0;
      let totalDistMeters = 0;
      let elapsedMinutes = 0;
      let totalRemainingCash = 0;

      const orderedNodes = order.map(idx => nodes[idx]);
      currentOrderedNodes = orderedNodes;
      const totalClientStops = prospects.length;

      let bestCashScore = -1;
      topCashStepPos = 1;
      orderedNodes.forEach((node, stepPos) => {
        if (stepPos === 0 || node.isStart) return;
        const isDone = Boolean(doneAddresses[node.address]);
        if (!isDone) {
          totalRemainingCash += (node.liveEval ? node.liveEval.potentialEur : 990);
          if (node.liveEval && node.liveEval.rawScore > bestCashScore) {
            bestCashScore = node.liveEval.rawScore;
            topCashStepPos = stepPos;
          }
        }
      });

      const htmlCards = [];
      const bottomStripCards = [];

      orderedNodes.forEach((node, stepPos) => {
        if (stepPos === 0) {
          const icon = L.divIcon({
            className: '',
            html: '<div class="g-pin start">D</div>',
            iconSize: [28, 28],
            iconAnchor: [14, 14]
          });
          mapMarkerRefs[0] = L.marker([node.lat, node.lon], { icon })
            .bindPopup(`<strong>Départ (${startTime.replace(':','h')})</strong><br>${escHtml(node.address)}`)
            .addTo(markersLayer);

          htmlCards.push(`
            <div class="stop-item" onclick="selectStopFromList(0)">
              <div class="badge-num start">D</div>
              <div>
                <strong style="display:block; font-size:13px;">Point de départ (${startTime.replace(':', 'h')})</strong>
                <div class="stop-meta-line">${escHtml(node.address)}</div>
              </div>
            </div>
          `);
          return;
        }

        const prevIdx = order[stepPos - 1];
        const currIdx = order[stepPos];
        const legSec = durations[prevIdx][currIdx];
        const legMeters = distances[prevIdx][currIdx];
        totalDriveSec += legSec;
        totalDistMeters += legMeters;

        const legMins = Math.max(1, Math.round(legSec / 60));
        const legKm = (legMeters / 1000).toFixed(1).replace('.', ',');
        elapsedMinutes += legMins;
        const arrivalStr = addMinutesToTime(startTime, elapsedMinutes);

        if (node.isStart) return;

        const isDone = Boolean(doneAddresses[node.address]);
        const isTopCash = (!isDone && stepPos === topCashStepPos);
        const ev = node.liveEval || evaluateRealTimeProspectPriority(node, nodes[0]);

        const icon = L.divIcon({
          className: '',
          html: `<div class="g-pin ${isDone ? 'done-pin' : (isTopCash ? 'cash-king-pin' : '')}" id="mapPin-${stepPos}">${isDone ? '✓' : stepPos}</div>`,

        mapMarkerRefs[stepPos] = L.marker([node.lat, node.lon], { icon })
          .on('click', () => scrollStripToStep(stepPos))
          .addTo(markersLayer);

        const singleMapsUrl = `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(node.address)}&travelmode=${gmapsTravelMode}`;
        const demoUrl = node.demo || '../sites/fastfood-smash.html';

        htmlCards.push(`
          <div class="stop-item ${isDone ? 'done' : ''}" id="stopCard-${stepPos}" onclick="selectStopFromList(${stepPos})">

        elapsedMinutes += dwellMins;
      });

      document.getElementById('itineraryOutput').innerHTML = htmlCards.join('');
      document.getElementById('mapCardsStrip').innerHTML = bottomStripCards.join('');

      const totalMins = Math.round(totalDriveSec / 60);
      const timeFormatted = totalMins >= 60
        ? `${Math.floor(totalMins / 60)}h${String(totalMins % 60).padStart(2, '0')}`
        : `${totalMins} min`;
      const distFormatted = (totalDistMeters / 1000).toFixed(1).replace('.', ',') + ' km';

      document.getElementById('statTotalCash').textContent = totalRemainingCash.toLocaleString('fr-FR') + ' €';
      document.getElementById('statDriveTime').textContent = timeFormatted;
      document.getElementById('statDistance').textContent = distFormatted;
      updateDoneCounters();
      refreshLiveCashDetector();

      let drawnGeometry = null;
      try {
        const coordsStr = orderedNodes.map(pt => `${pt.lon},${pt.lat}`).join(';');
        const res = await fetch(`https://router.project-osrm.org/route/v1/driving/${coordsStr}?overview=full&geometries=geojson`);
        const data = await res.json();
        if (data.code === 'Ok' && data.routes && data.routes[0]) {
          drawnGeometry = data.routes[0].geometry.coordinates.map(c => [c[1], c[0]]);
        }
      } catch (e) {}

      if (!drawnGeometry) drawnGeometry = orderedNodes.map(pt => [pt.lat, pt.lon]);

      routeShadowLine = L.polyline(drawnGeometry, { color: '#FFFFFF', weight: 7, opacity: 0.9 }).addTo(map);
      routeMainLine = L.polyline(drawnGeometry, { color: '#2563EB', weight: 4, opacity: 0.95 }).addTo(map);
      if (window.innerWidth <= 920) {
        map.fitBounds(routeMainLine.getBounds(), { paddingTopLeft: [24, 24], paddingBottomRight: [24, 155] });
      } else {
        map.fitBounds(routeMainLine.getBounds(), { padding: [40, 40] });
      }

      buildGoogleMapsExportLinks(orderedNodes);
    }

    function refreshLiveCashDetector() {
      const now = new Date();
      const hh = String(now.getHours()).padStart(2, '0');
      const mm = String(now.getMinutes()).padStart(2, '0');
      document.getElementById('radarClock').textContent = `${hh}h${mm}`;

      if (!currentOrderedNodes || currentOrderedNodes.length <= 1) return;

      const refPoint = userGpsCoords || currentOrderedNodes[0];
      let bestStep = -1;
      let bestNode = null;
      let bestScore = -1;

      currentOrderedNodes.forEach((node, stepPos) => {
        if (stepPos === 0 || node.isStart) return;
        if (doneAddresses[node.address]) return;
        node.liveEval = evaluateRealTimeProspectPriority(node, refPoint);
        if (node.liveEval.rawScore > bestScore) {
          bestScore = node.liveEval.rawScore;
          bestNode = node;
          bestStep = stepPos;
        }
      });

      if (!bestNode) {
        document.getElementById('radarTargetName').textContent = 'Tournée terminée';
        document.getElementById('radarTargetReason').textContent = '';
        document.getElementById('mobileRadarName').textContent = 'Tournée terminée';
        return;
      }

      topCashStepPos = bestStep;
      const ev = bestNode.liveEval;
      document.getElementById('radarTargetName').textContent = `#${bestStep} ${bestNode.name}`;
      document.getElementById('radarTargetReason').textContent = `(${ev.potentialEur} € · ${ev.displayScore}%)`;
      document.getElementById('mobileRadarName').textContent = `#${bestStep} ${bestNode.name} (${ev.potentialEur} €)`;
    }

    function focusTopCashTarget() {
      if (!currentOrderedNodes || currentOrderedNodes.length <= 1) return;
      if (window.innerWidth <= 920) switchMobileMode('map');
      const wrap = document.getElementById('mapBottomWrapper');
      if (wrap.classList.contains('collapsed')) toggleBottomCardsCollapse();
      scrollStripToStep(topCashStepPos);
      const listCard = document.getElementById(`stopCard-${topCashStepPos}`);
      if (listCard) listCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    function updateDoneCounters() {
      const totalStops = prospects.length;
      let doneCount = 0;
      let remainingCash = 0;
      currentOrderedNodes.forEach(n => {
        if (!n.isStart) {
          if (doneAddresses[n.address]) {
            doneCount++;
          } else {
            remainingCash += (n.liveEval ? n.liveEval.potentialEur : (n.potentialEur || 990));
          }
        }
      });
      document.getElementById('doneProgressBadge').textContent = `${doneCount}/${totalStops}`;
      document.getElementById('mNavCount').textContent = `${doneCount}/${totalStops}`;
      document.getElementById('statTotalCash').textContent = remainingCash.toLocaleString('fr-FR') + ' €';
    }

    function toggleStopDone(stepPos, address) {
      const nowDone = !doneAddresses[address];
      if (nowDone) doneAddresses[address] = true;
      else delete doneAddresses[address];
      saveProspects();

      const stopCard = document.getElementById(`stopCard-${stepPos}`);
      const listBadge = document.getElementById(`listBadge-${stepPos}`);
      const mscCard = document.getElementById(`mscCard-${stepPos}`);
      const mscDoneBtn = document.getElementById(`mscDoneBtn-${stepPos}`);
      const mapPin = document.getElementById(`mapPin-${stepPos}`);

      if (stopCard) stopCard.classList.toggle('done', nowDone);
      if (listBadge) listBadge.textContent = nowDone ? '✓' : stepPos;
      if (mscCard) mscCard.classList.toggle('done-card', nowDone);
      if (mscDoneBtn) {
        mscDoneBtn.classList.toggle('is-done', nowDone);
        mscDoneBtn.textContent = nowDone ? 'Fait ✓' : 'Fait';
      }
      if (mapPin) {
        mapPin.classList.toggle('done-pin', nowDone);
        mapPin.textContent = nowDone ? '✓' : stepPos;
      }

      updateDoneCounters();
      refreshLiveCashDetector();

      if (nowDone && document.getElementById(`mscCard-${stepPos + 1}`)) {
        setTimeout(() => scrollStripToStep(stepPos + 1), 220);
      }
    }

    function resetDoneStatus() {
      doneAddresses = {};
      saveProspects();
      if (cachedGeoNodes.length > 1) {
        rebuildDisplayFromCache();
      } else {
        optimizeRoute();
      }
    }

    function selectStopFromList(stepPos) {
      if (window.innerWidth <= 920) switchMobileMode('map');
      const wrap = document.getElementById('mapBottomWrapper');
      if (wrap.classList.contains('collapsed')) toggleBottomCardsCollapse();
      if (stepPos === 0) {
        const m = mapMarkerRefs[0];
        if (m) map.flyTo(m.getLatLng(), 16, { duration: 0.5 });
      } else {
        scrollStripToStep(stepPos);
      }
    }

    function scrollStripToStep(stepPos) {
      const wrap = document.getElementById('mapBottomWrapper');
      if (wrap && wrap.classList.contains('collapsed')) {
        toggleBottomCardsCollapse();
      }
      const card = document.getElementById(`mscCard-${stepPos}`);
      const strip = document.getElementById('mapCardsStrip');
      if (card && strip) {
        isProgrammaticScroll = true;
        const targetLeft = card.offsetLeft - (strip.clientWidth - card.offsetWidth) / 2;
        strip.scrollTo({ left: targetLeft, behavior: 'smooth' });
        setTimeout(() => { isProgrammaticScroll = false; }, 450);
      }
      highlightActiveCardAndPin(stepPos, true);
    }

    function highlightActiveCardAndPin(stepPos, flyMap = true) {
      document.querySelectorAll('.stop-item').forEach(c => c.classList.remove('active-list-item'));
      const listCard = document.getElementById(`stopCard-${stepPos}`);
      if (listCard) listCard.classList.add('active-list-item');

      const m = mapMarkerRefs[stepPos];
      if (m && flyMap) {
        map.flyTo(m.getLatLng(), 16, { duration: 0.45 });
      }
    }

    function buildGoogleMapsExportLinks(orderedNodes) {
      const exportBox = document.getElementById('exportBox');
      const container = document.getElementById('gmapsSegmentsContainer');
      exportBox.style.display = 'block';
      generatedGmapsUrls = [];

      const allWaypoints = orderedNodes.map(n => encodeURIComponent(n.address)).join('/');
      generatedGmapsUrls.push({ label: 'Ouvrir dans Google Maps', url: `https://www.google.com/maps/dir/${allWaypoints}` });

      if (orderedNodes.length > 10) {
        const chunkSize = 9;
        let partNum = 1;
        for (let i = 0; i < orderedNodes.length - 1; i += chunkSize) {
          const slice = orderedNodes.slice(i, i + chunkSize + 1);
          const url = 'https://www.google.com/maps/dir/' + slice.map(n => encodeURIComponent(n.address)).join('/');
          generatedGmapsUrls.push({
            label: `Segment ${partNum} (${i === 0 ? 1 : i}-${Math.min(i + chunkSize, orderedNodes.length - 1)})`,
            url
          });
          partNum++;
        }
      }

      container.innerHTML = generatedGmapsUrls.map((item, idx) => `
        <a href="${item.url}" target="_blank" rel="noopener noreferrer" class="btn ${idx === 0 ? 'btn-blue' : 'btn-outline'} btn-xs">
          ${item.label}
        </a>
      `).join('');
    }

    window.addEventListener('DOMContentLoaded', () => {
      checkDevAuth();
      initMap();
      loadProspects();
      if (prospects.length > 0) {
        optimizeRoute();
      } else {
        clearMapAndUIOnly();
      }
    });
  </script>
</body>
</html>
